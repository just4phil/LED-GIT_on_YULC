# Technische Show (von Claude aus song.yaml + Analyse + dem handgeschriebenen Physical() abgeleitet).
# Idee: 80er-Neon. Verses dunkel in Blau/Lila (ROYAL), Chorusse in Neon, Bridge warm (SUNSET), Finale brennt.
# Aus dem alten Code übernommen: das Motiv "1 Takt Strobo auf jedes 'Let's get physical'" (erstes und letztes
# Mal weiß, dazwischen farbig) und Black + Strobo-Auftakt auf dem Sprach-Sample vor Chorus 1.
# Neu gegenüber dem alten Code: sichtbarer Wechsel beim Band-Einsatz (+14 dB), alle Chorusse erkennbar gleich,
# Bewegung über die Bühne in der Bridge.
# 18.10.2026 (erste Generierung, Wunsch des Users: "für alle noch nicht generierten songs jetzt den song neu generieren
# ... den alten code erstmal nur auskommentieren!"): die Strobo-Stellen laufen nicht mehr über progStrobo (eigener
# Zähler, nicht beat-genau, Zufallsfarbe je Gerät - Regel aus Take On Me), sondern als SCENE_COLORS + gate: weiß bzw.
# eine gemeinsame Neon-Farbe pro Beat, 4 Blitze pro Beat im Takt. Der Trailer PhysicalTrailer() springt über die
# Konstante GEN_PHYSICAL_SAMPLE_TAIL in den Strobo-Auftakt vor Chorus 1 (früher feste Part-Nummer 40).

scheme: SCHEME_NEON
# Schluss-Black 6,53 s (4 Takte, wie im alten Code): steht in der Tabelle in der Zeile "Ende".

# Bund-Marker (unverändert aus der früheren song.yaml übernommen): der alte Code schaltet für Rina zusätzlich
# markerLED5 = ASaite_E ein ("lets get physical" nach Chorus 2 und "hold on 1") und danach wieder aus.
# {Slot: Marker}, nur für den Bass.
markers:
  parts:
    chorus 2 hit: {bass: {5: ASaite_E}}
    bridge 1:     {bass: {5: ASaite_E}}

sections:
  pause:
    fx: "progBlack(${dur}, ${next})"

  synth intro:
    scene: SCENE_CALM
    scheme: SCHEME_ROYAL
    tail:
      beats: 2
      scene: SCENE_BUILDUP
      scheme: SCHEME_WHITE
    why: "nur Synth, sehr leise (-21 dB): ruhiges Atmen; der Auftakt im letzten halben Takt lädt auf und explodiert auf den Band-Einsatz"

  intro band:
    scene: SCENE_WAVE_OUT
    scheme: SCHEME_NEON
    why: "größter Pegelsprung im Song (+14 dB): Blitze laufen pro Beat von den Drums nach außen"

  verse 1:
    scene: SCENE_VERSE
    scheme: SCHEME_ROYAL
    why: "rhythmischer Puls im Beat, dunkler als das Intro, damit der Chorus aufgehen kann"

  sample:
    fx: "progBlack(${dur}, ${next})"
    tail:
      beats: 2
      scene: SCENE_COLORS
      scheme: SCHEME_WHITE
      gate: 4
    why: "Schwarz auf dem Sprach-Sample, im letzten halben Takt weißer Strobo im Takt (4 Blitze pro Beat) auf dem Synth-Auftakt - hier steigt auch der Trailer ein."

  chorus 1:
    scene: SCENE_DROP
    scheme: SCHEME_NEON
    why: "lautester Formteil: volle Energie im Beat, Neon"

  chorus 1 hit:
    scene: SCENE_COLORS
    scheme: SCHEME_WHITE
    gate: 4
    why: "Motiv 'Let's get physical': 1 Takt weißer Strobo im Takt (4 Blitze pro Beat), beim ersten Mal weiß"

  drum fill:
    scene: SCENE_SOLO_DRUMS
    scheme: SCHEME_NEON
    why: "nur Drums: Spotlight auf die Mitte, der Rest tritt zurück"

  snare roll:
    scene: SCENE_BUILDUP
    scheme: SCHEME_WHITE
    why: "Snare-Wirbel steigert sich (build 1.0): lädt einen Takt auf, Explosion auf Verse 2"

  verse 2:
    scene: SCENE_VERSE_HEART
    scheme: SCHEME_ROYAL
    why: "zweite Strophe anders als die erste (18.10.2026): alle Geräte schlagen auf jedem Beat wie ein Herz, die Matrix zeigt eine Lissajous-Schleife"

  pre-chorus 2:
    scene: SCENE_BUILDUP
    scheme: SCHEME_WHITE
    why: "die Band spielt hier durch (kein Stopp wie beim ersten Mal): aufladen statt Black, Explosion auf Chorus 2"

  chorus 2:
    scene: SCENE_DROP
    scheme: SCHEME_NEON
    why: "erkennbar gleich wie Chorus 1"

  chorus 2 hit:
    scene: SCENE_COLORS
    scheme: SCHEME_NEON
    gate: 4
    why: "Motiv 'Let's get physical': 1 Takt Strobo im Takt (4 Blitze pro Beat), die ganze Bühne in einer Neon-Farbe pro Beat"

  bridge 1:
    scene: SCENE_PINGPONG
    scheme: SCHEME_SUNSET
    why: "'Hold on': neue Farbe, das Licht springt pro Beat von Gerät zu Gerät"

  bridge 2:
    scene: SCENE_WAVE_OUT
    scheme: SCHEME_SUNSET
    why: "zweite Hälfte der Bridge: Bewegung wird gerichtet, von der Mitte nach außen"

  bridge hit:
    scene: SCENE_COLORS
    scheme: SCHEME_NEON
    gate: 4
    why: "Motiv 'Let's get physical': 1 Takt Strobo im Takt in einer Neon-Farbe pro Beat; danach fällt alles in den Breakdown"

  chorus 3 solo voc:
    scene: SCENE_CALM
    scheme: SCHEME_BLUE
    why: "Breakdown, Gesang fast allein (-12 dB): alles zieht sich zurück"

  chorus 3 solo voc hit:
    scene: SCENE_COLORS
    scheme: SCHEME_NEON
    gate: 4
    why: "Motiv 'Let's get physical': 1 Takt Strobo im Takt in einer Neon-Farbe pro Beat; die Band kommt zurück"

  chorus 3:
    scene: SCENE_DROP
    scheme: SCHEME_NEON
    why: "Chorus wieder voll, erkennbar gleich"

  chorus 3 hit:
    scene: SCENE_COLORS
    scheme: SCHEME_NEON
    gate: 4
    why: "Motiv 'Let's get physical': 1 Takt Strobo im Takt (4 Blitze pro Beat), die ganze Bühne in einer Neon-Farbe pro Beat"

  outro:
    scene: SCENE_FIRE
    scheme: SCHEME_FIRE
    why: "Finale eine Stufe über dem Chorus: Feuer auf allen Geräten"

  outro hit:
    scene: SCENE_COLORS
    scheme: SCHEME_WHITE
    gate: 4
    why: "Letztes 'Physical': weißer Strobo im Takt wie beim ersten Mal, danach schwarz"
