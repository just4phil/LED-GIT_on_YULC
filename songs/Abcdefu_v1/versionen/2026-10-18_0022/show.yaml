# Technische Show (von Claude aus quelle/struktur.xlsx abgeleitet, 06.10.2026).
# Vorgabe des Users: Parts ohne Änderungswunsch behalten erst einmal den alten Effekt aus Abcdefu()
# (Spalte "bisher (alter Code)") - sie stehen hier 1:1 als fx:. Der alte Code bleibt in src/songs.cpp.
# Kein Farbschema auf Song-Ebene: die alten Effekte laufen dadurch wie bisher mit freien Zufallsfarben.
# why: steht bei jeder Generierung in der Spalte "Effekt (füllt KI)" der Tabelle - deshalb beschreibt es, was man sieht.
# Auf Wunsch des Users geändert (06.10.2026):
#   pause / intro   = die Pause ist ganz schwarz, das Füllen (progBlingBlingColoring) beginnt erst mit dem Intro
#   strobe          = "FUCK OFF" schwarz ausgestanzt über dem weißen Strobo
#   A B C D E       = in den letzten 1,5 Takten vor jedem Chorus die Buchstaben auf die Viertel (Matrix, über dem Effekt)
#   FUCK YOU        = auf jeden Chorus-Einsatz als Text auf der Matrix, immer ohne "!". Chorus 1: schwarz ausgestanzt,
#                     3 Takte ohne Ausblenden (Weiß hob sich dort nicht ab). Chorus 2 und 3: weiß, blendet über 2 Takte aus
#   Stopp           = schneller Blinder auf den Stopp und auf den Wiedereinstieg danach
#   verse 2 weiter  = "was anderes": Puls im Beat (SCENE_VERSE, Neon) statt noch einmal das langsame Füllen
#   FUCK YOU (17.10.2026, Wünsche in den Zwischenzeilen) = zusätzlich auf jedes "F-U" im Chorus (Takt x,75 / x,25) und
#                     schon eine Viertel vor Chorus 2 und 3: immer schwarz ausgestanzt, 1,5 Takte voll, dann 0,5 Takte
#                     ausblenden - auch über die Part-Grenze (mehrere Zeitfenster je Part: windows:). Wo im selben Part
#                     A B C D E läuft (weiß, Text-Ebene), steht FUCK YOU in der Effekt-Ebene darunter (progShowText,
#                     zwei progText in einem Part gehen nicht). Der FUCK YOU am Anfang von Chorus 1 bleibt wie abgenommen.
#                     Das letzte im Chorus (Takt x,25) heißt FUCK OFF (Tabelle), auch im Part danach, der es ausblendet.
#                     Ab 80,75 (Chorus 3 + Triolen) weiß mit schwarzem Rand statt ausgestanzt: über den dunklen Einzel-
#                     blitzen von progFastBlingBling war ausgestanzter Text unsichtbar (User, 18.10.2026).
#   Blinder         = neu auf 48,75 (na na na na, klingt bis 49,25 aus); der Stopp-Blinder kommt jetzt schon bei 51,875
#   triolen         = Strobo wechselt auf jedem Viertel: ein Viertel an, ein Viertel aus (zwei triolische Fassungen
#                     mit 78 und 156 ms und ein Blitz pro Viertel mit 234 ms waren es nicht)
# Bund-Marker: der alte Code setzt in Abcdefu() keine Marker in einzelnen Parts; die Grund-Marker stehen von Hand in
# src/markerLEDs.cpp (case 15) und gelten unverändert - deshalb hier kein markers:-Block.
# Schluss-Black 10,3 s: steht in der Tabelle in der Zeile "Ende".

function: gen_Abcdefu

sections:
  pause:
    fx: "progBlack(${dur}, ${next})"
    why: "Alles schwarz bis zum Intro (die Matrix zeigt den Titel-Lauftext)."

  intro:
    fx: "progBlingBlingColoring(${dur}, ${next}, 3000)"
    why: "Jedes Gerät füllt sich langsam LED für LED mit einer Farbe, alle 3 s kommt die nächste. Beginnt erst hier, nicht schon in der Pause."

  strobe:
    fx: "progStrobo(${dur}, ${next}, 75, 255, 255, 255)"
    text: {words: "FUCK_OFF", per: 4, color: schwarz, over: true}
    why: "2 Beats weißes Flimmern als Absprung in die Strophe (alter Effekt). Auf der Matrix steht dabei FUCK OFF schwarz ausgestanzt im Strobo: die Buchstaben bleiben dunkel, das Weiß blitzt drumherum."

  verse 1a:
    fx: "progPalette(${dur}, 1, ${next})"
    why: "Alter Effekt: Regenbogen-Streifen mit harten Kanten laufen über die Geräte."

  verse 1b:
    fx: "progMatrixScanner(${dur}, ${next}, 1)"
    why: "Alter Effekt: schneller Scanner, eine Leuchtlinie fährt hin und her."

  i was into you:
    fx: "progPalette(${dur}, 3, ${next})"
    text: {words: "A B C D E*9", per: beat, color: weiss, over: true, from: 26, to: 31}
    why: "Alter Effekt: lila und grüne Balken. Ab Takt 6,5 des Parts (Beat 26) erscheinen auf der Matrix A, B, C, D, E in Weiß, je ein Viertel lang, über dem gedimmten Effekt."

  chorus 1:
    fx: "progFullColors(${dur}, ${next}, ${beat})"
    text: {words: "FUCK_YOU*29 FUCK_OFF*35", per: beat, color: schwarz, over: true, windows: [{from: 0, to: 12, hard: true}, [15, 23], [29, 37]], fade_out: 2}
    cues:
      40.75: "FUCK YOU schwarz ausgestanzt, 1,5 Takte voll, dann bis 42,75 ausblenden"
      44.25: "FUCK OFF schwarz ausgestanzt, 1,5 Takte voll, blendet im na na na na bis 46,25 aus"
    why: "Alter Effekt: alle LEDs einfarbig, pro Beat eine neue Farbe. Auf der Matrix steht FUCK YOU schwarz ausgestanzt in der Farbfläche (Buchstaben dunkel, Farbe drumherum): die ersten 3 Takte hart an und hart weg, dann auf 40,75 FUCK YOU und auf 44,25 FUCK OFF, je 1,5 Takte voll und 0,5 Takte ausblendend."

  na na na na:
    fx: "progSternNeu(${dur}, ${beat}, ${next}, 5, 26, 5, false, 4)"
    text: {words: "FUCK_OFF", per: 64, color: schwarz, over: true, windows: [[0, 5]], fade_out: 2}
    blinder: {bar: 48.75, len: 2.5, attack: 0.5, carry: true}
    cues:
      48.75: "Blinder (warmweiß, alle Geräte): blendet eine halbe Viertel ein, auf 48,75 voll, klingt bis 49,25 aus"
    why: "Alter Effekt: drehender Stern, fest in der Mitte, Farbwechsel pro Beat. Das FUCK OFF aus dem Chorus steht noch 3 Beats und blendet bis 46,25 aus. Auf 48,75 ein warmweißer Blinder, der bis 49,25 in die Strophe ausklingt."

  verse 2:
    fx: "progBlingBlingColoring(${dur}, ${next}, 5000)"
    blinder: {bar: 51.875, len: 1, carry: true}
    cues:
      51.75: "Blinder auf 51,875 (eine Achtel vor dem Stopp), klingt in 1 Beat in den Stopp aus"
    why: "Alter Effekt: langsames Füllen LED für LED, alle 5 s eine neue Farbe. Eine Achtel vor dem Stopp (51,875) blitzt ein schneller Blinder (warmweiß, alle Geräte) und klingt in 1 Beat ins Schwarz des Stopps ab."

  STOP:
    fx: "progBlack(${dur}, ${next})"
    why: "1 Takt Stille (der Blinder davor klingt noch kurz aus)."

  verse 2 weiter:
    scene: SCENE_VERSE
    scheme: SCHEME_NEON
    blinder: {at: 0, len: 1}
    why: "Schneller Blinder (1 Beat) auf den Wiedereinstieg, dann dezenter Puls im Beat in Pink/Cyan/Violett: Zonen der Gitarre, Lichtschuss in den Lampen, Regen auf der Matrix (statt noch einmal das langsame Füllen)."

  i was into you (2):
    fx: "progWaterRipple(${dur}, ${next}, 50, true, false)"
    text: {words: "A B C D E*9", per: beat, color: weiss, over: true, from: 26, to: 31}
    overlay: {devices: {matrix: "progShowText(\"FUCK YOU\", ${dur}, (MATRIX_WIDTH - 47) / 2, max(0, (MATRIX_HEIGHT - 7) / 2), 0xFFFF, ${next})"}, mode: cut, windows: [[31, 39]], fade_out: 2}
    cues:
      64.75: "FUCK YOU schwarz ausgestanzt schon eine Viertel vor dem Chorus, 1,5 Takte voll, blendet im Chorus bis 66,75 aus"
    why: "Alter Effekt: Wasserringe an zufälligen Stellen, mit Farbverlauf. Ab Takt 6,5 des Parts (Beat 26) erscheinen auf der Matrix A, B, C, D, E in Weiß, je ein Viertel lang, über dem gedimmten Effekt. Auf der letzten Viertel (64,75) steht FUCK YOU schwarz ausgestanzt und bleibt bis in den Chorus."

  chorus 2:
    fx: "progFullColors(${dur}, ${next}, ${beat})"
    text: {words: "FUCK_YOU*29 FUCK_OFF*35", per: beat, color: schwarz, over: true, windows: [[0, 7], [15, 23], [29, 37]], fade_out: 2}
    cues:
      68.75: "FUCK YOU schwarz ausgestanzt, 1,5 Takte voll, dann bis 70,75 ausblenden"
      72.25: "FUCK OFF schwarz ausgestanzt, 1,5 Takte voll, blendet im na na na na bis 74,25 aus"
    why: "Alter Effekt wie Chorus 1: pro Beat eine neue Farbe. Auf der Matrix FUCK YOU schwarz ausgestanzt in der Farbfläche: das von der Viertel davor steht bis 66,25 und blendet bis 66,75 aus, dann auf 68,75 FUCK YOU und auf 72,25 FUCK OFF, je 1,5 Takte voll und 0,5 Takte ausblendend."

  na na na na (2):
    fx: "progSternNeu(${dur}, ${beat}, ${next}, 5, 26, 5, true, 4)"
    text: {words: "A B C D E FUCK_YOU*8", per: beat, color: weiss, over: true, windows: [[26, 39]], fade_out: 2, outline: true}
    overlay: {devices: {matrix: "progShowText(\"FUCK OFF\", ${dur}, (MATRIX_WIDTH - 47) / 2, max(0, (MATRIX_HEIGHT - 7) / 2), 0xFFFF, ${next})"}, mode: cut, windows: [[0, 5]], fade_out: 2}
    cues:
      80.75: "FUCK YOU weiß mit schwarzem Rand schon eine Viertel vor dem Chorus, 1,5 Takte voll, blendet im Chorus bis 82,75 aus"
    why: "Alter Effekt: drehender Stern, diesmal wandernd. Das FUCK OFF aus dem Chorus steht noch 3 Beats und blendet bis 74,25 aus. Ab Takt 6,5 des Parts (Beat 26) erscheinen auf der Matrix A, B, C, D, E in Weiß, je ein Viertel lang, über dem gedimmten Effekt; auf der letzten Viertel (80,75) folgt FUCK YOU, ebenfalls weiß mit schwarzem Rand, und bleibt bis in den Chorus."

  chorus 3:
    fx: "progFastBlingBling(${dur}, 4, ${next})"
    text: {words: "FUCK_YOU*29 FUCK_OFF*35", per: beat, color: weiss, over: true, windows: [[0, 7], [15, 23], [29, 37]], fade_out: 2, outline: true}
    cues:
      84.75: "FUCK YOU weiß mit schwarzem Rand, 1,5 Takte voll, dann bis 86,75 ausblenden"
      88.25: "FUCK OFF weiß mit schwarzem Rand, 1,5 Takte voll, blendet in den Triolen bis 90,25 aus"
    why: "Alter Effekt: schnelle Einzelblitze für den letzten Chorus. Auf der Matrix FUCK YOU in Weiß mit schwarzem Rand, die Blitze darunter gedimmt (ausgestanzt war es über den dunklen Blitzen nicht zu sehen): das von der Viertel davor steht bis 82,25 und blendet bis 82,75 aus, dann auf 84,75 FUCK YOU und auf 88,25 FUCK OFF, je 1,5 Takte voll und 0,5 Takte ausblendend."

  triolen:
    fx: "progStrobo(${dur}, ${next}, ${beat}, 255, 255, 255)"
    text: {words: "FUCK_OFF", per: 64, color: weiss, over: true, windows: [[0, 5]], fade_out: 2, outline: true, under: 50}
    why: "Das FUCK OFF aus dem Chorus steht noch 3 Beats in Weiß mit schwarzem Rand über dem halb gedimmten Strobo und blendet bis 90,25 aus. Weißer Strobo im Viertel-Raster: ein Viertel lang an, das nächste Viertel aus (469 ms), auf allen Geräten gleich."
