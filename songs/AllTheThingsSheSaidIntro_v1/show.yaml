# Technische Show (von Claude aus quelle/struktur.xlsx abgeleitet, 10.10.2026).
# Vorspann (Einspieler) zu "All The Things She Said" (Song-ID 82), springt bei Takt 28 ohne Pause in dessen
# Part "intro: all thet …." (Takt 6 der Tabelle von Song #31, die Chorus-Melodie mit der ganzen Band).
# Zweite Fassung (10.10.2026): der User hat alle Stellen selbst aufs Raster gelegt (Spalte "Änderungswunsch" der
# Zwischenzeilen) - es gilt nur noch, was dort steht. Die erste Fassung war aus dem Vorspann zu "I Love It"
# umgerechnet; ihre Feuer-Impulse auf den Lampen stehen nicht mehr in der Tabelle und sind deshalb entfallen.
# Wünsche und ihre Umsetzung:
#   Takt 3, 4, 5        kurzer starker Blinder, eine Viertel lang
#   Takt 6, 8, 9,5      starker Blinder, klingt über 1 Takt aus (der bei 9,5 reicht über die Part-Grenze: carry)
#   Takt 10             Lauftext "NERDS ON FIRE" 1x auf der Matrix (90 ms je Pixel = 11,7 s, fertig kurz nach Takt 14)
#   Takt 15             Wasserwellen (progWaterRipple) auf der Matrix, bis zum Strobo
#   Takt 17             (Lauftext Songtitel: am 10.10.2026 wieder herausgenommen, siehe unten)
#   Takt 20, 21,5       starker Blinder, klingt über 1 Takt aus
#   Takt 23,5 / 25 / 26,5   Blinder + ein Wort weiß auf der Matrix: THE, NERDS, ON
#   Takt 27,25          STOP: alle Geräte blenden in einer Achtel auf Schwarz
#   Takt 27,5           Blinder + "FIRE" weiß auf der Matrix (Part "strobo" beginnt hier)
#   Takt 27,75          Strobo (eine Viertel), "FIRE" schwarz ausgestanzt
#   Takt 28             Sprung in den Song
# Die Matrix zeigt ab Takt 10 und ab Takt 17 etwas anderes als davor - das geht nur mit eigenen Parts. Die Zeilen
# 10 und 17 der Tabelle haben deshalb einen Songpart-Namen: "text nerds on fire" und "text songtitel".
# Dritte Fassung (10.10.2026, Tabelle überarbeitet): "NERDS ON FIRE" nur noch 1x; bei Takt 28 steht jetzt "FIRE".
# Vierte Fassung (12.10.2026): der User hat das Ende um einen Takt gekürzt - der Sprung in den Song liegt jetzt bei
# Takt 28 statt 29. Davor neu ein STOP bei Takt 27,25; "FIRE" rückt auf 27,5, der Strobo auf 27,75 und dauert nur
# noch eine Viertel. In der Tabelle beginnt der Part "strobo" jetzt bei 27,5 und "Ende" steht bei 28. Der STOP
# liegt in den letzten Beats von "text songtitel" (Text und Wellen sind dort Ebenen mit Zeitfenster), der Strobo
# ist die Schluss-Viertel (tail) des Parts "strobo".
# Annahmen von Claude, noch nicht vom User bestätigt:
#   - "NERDS ON FIRE" läuft im gewohnten Tempo der Titel-Lauftexte (90 ms je Pixel) und ist kurz nach Takt 14
#     fertig; danach ist die Matrix dunkel, bis bei Takt 15 die Wellen kommen
#   - Bund-Marker: dieselben wie bei Song #31 (case 31 in src/markerLEDs.cpp), damit sie schon im Vorspann
#     leuchten und beim Sprung in den Song stehen bleiben - so wie case 80 die Marker von Song #9 trägt
# Entscheidung des Users (10.10.2026): der Titel-Lauftext läuft NICHT im Vorspann, sondern wie beim Vorspann zu
# "I Love It" erst im Song - auf der Matrix ab dem Einstieg in "intro: all thet …." (trailer_entry in
# songs/AllTheThingsSheSaid_v1/show.yaml). Deshalb scroll_text: false und kein Lauftext mehr bei Takt 17; von
# Takt 17 bis 23,5 zeigt die Matrix nur die Wasserwellen.
# Schluss: kein Schluss-Black (Zeile "Ende" der Tabelle: 0 sek.), next_song springt ohne Pause nach Song #31.
# why: steht bei jeder Generierung in der Spalte "Effekt (füllt KI)" der Tabelle - deshalb beschreibt es, was man sieht.
# Taktnummern (bar:, cues:, ${bar:...}) zählen wie die Tabelle ab 1.

function: gen_AllTheThingsSheSaidIntro
scroll_text: false
next_song: AllTheThingsSheSaid_v1
# Kein Schluss-Black: die Zeile "Ende" der Tabelle (jetzt bei Takt 28) nennt seit dem Verschieben keine Zeit mehr
# ("0 sek." stand in der alten Ende-Zeile bei Takt 29). Ohne diese Angabe kämen 10 s Schwarz vor dem Sprung.
end_black_ms: 0

# Bund-Marker getrennt für Gitarre und Bass (23.10.2026), wie case 31 in src/markerLEDs.cpp - beide gleich halten.
# Solange beide Listen gleich sind, erzeugt songgen.py keinen #ifdef; erst wenn sie sich unterscheiden.
markers:
  guitar: [ESaite_F, ASaite_C, ASaite_E, ASaite_F]
  bass:   [ESaite_F, ASaite_C]    # am Bass ohne ASaite_E (LED 49) und ASaite_F (LED 48), wie case 31

sections:
  "pause":
    fx: "progBlack(${dur}, ${next})"
    # "kurzer starker Blinder eine viertel": springt auf dem Schlag voll auf, steht 0,3 Beat (210 ms) und ist nach
    # genau einer Viertel (698 ms) wieder aus.
    # "starker Blinder fadet 1 takt lang aus": springt auf, steht 0,2 Beat (140 ms), klingt bis zum Ende des Takts
    # (4 Beats) aus. Der bei Takt 9,5 endet erst bei 10,5 - der Part aber schon bei 10: carry: true lässt ihn im
    # Part danach zu Ende klingen statt abzureißen.
    blinder:
      - {bar: 3, len: 1, hold: 0.3, amount: 100}
      - {bar: 4, len: 1, hold: 0.3, amount: 100}
      - {bar: 5, len: 1, hold: 0.3, amount: 100}
      - {bar: 6, len: 4, hold: 0.2, amount: 100}
      - {bar: 8, len: 4, hold: 0.2, amount: 100}
      - {bar: 9.5, len: 4, hold: 0.2, amount: 100, carry: true}
    cues:
      3: "kurzer voller warmweißer Blinder auf allen Geräten: springt auf der 1 auf, 210 ms voll, am Ende der Viertel wieder dunkel"
      4: "Blinder auf der 1, gleiche Form"
      5: "Blinder auf der 1, gleiche Form"
      6: "voller warmweißer Blinder auf allen Geräten auf der 1, klingt über 1 Takt aus (bis Takt 7)"
      8: "Blinder auf der 1, klingt über 1 Takt aus (bis Takt 9)"
      9.5: "Blinder, klingt über 1 Takt aus (bis Takt 10,5, über die Part-Grenze hinweg)"
    why: "Alles dunkel, der Einspieler läuft. Kurze Blinder auf die 1 von Takt 3, 4 und 5; bei Takt 6, 8 und 9,5 je ein Blinder, der über einen Takt ausklingt."

  "text nerds on fire":
    fx: "progBlack(${dur}, ${next})"
    # Ein Durchlauf ist (54 - 2 + 6 x 13 Zeichen) x 90 ms = 11700 ms, der Part dauert 19535 ms: progScrollText zeigt
    # nur ganze Durchläufe, also genau einen - danach bleibt die Matrix dunkel (ab etwa Takt 14,2).
    devices:
      matrix: "progScrollText(\"NERDS ON FIRE\", ${dur}, 90, getRandomColor(), ${next})"
    # Wasserwellen ab Takt 15, nur auf der Matrix. Takt 15 liegt mitten im Part (20 Beats nach seinem Anfang bei
    # Takt 10), deshalb als Ebene mit Zeitfenster: from = ab hier sichtbar, fade_in = die Wellen tauchen über
    # 2 Beats auf statt aufzuspringen (50 ms je Schritt, Zufallsfarben mit Farbverlauf, Einschlagstellen zufällig).
    overlay:
      devices: {matrix: "progWaterRipple(${dur}, ${next}, 50, true, false)"}
      from: 20
      fade_in: 2
    cues:
      15: "Ab hier Wasserwellen (progWaterRipple, bunte Ringe) nur auf der Matrix, tauchen über 2 Beats auf; sie laufen als Grundbild weiter bis zum Strobo"
    why: "Nur die Matrix: Lauftext \"NERDS ON FIRE\", einmal (fertig kurz nach Takt 14). Ab Takt 15 laufen Wasserwellen. Alle anderen Geräte sind dunkel."

  "text songtitel":
    fx: "progBlack(${dur}, ${next})"
    # Die Wasserwellen laufen auf der Matrix weiter. Jeder Part startet den Effekt neu; transition: fade blendet
    # deshalb über 2 Beats vom letzten Wellenbild des Parts davor ins neue.
    devices:
      matrix: "progWaterRipple(${dur}, ${next}, 50, true, false)"
    transition: {type: fade, beats: 2}
    blinder:
      - {bar: 20, len: 4, hold: 0.2, amount: 100}
      - {bar: 21.5, len: 4, hold: 0.2, amount: 100}
    # Ab Takt 23,5 (die letzten 16 Beats des Parts) als eigener Schluss-Part, damit die drei Einsätze auf seinem
    # Raster von 1,5 Takten liegen (Beat 0, 6, 12 = Takt 23,5 / 25 / 26,5): je Einsatz das nächste Wort weiß auf der
    # Matrix (THE, NERDS je 3 x 2 Beats, ON bis zum STOP), pulse lässt das Wort alle 6 Beats voll aufspringen und
    # bis auf Schwarz abklingen. Die Blinder liegen über allem.
    # STOP bei Takt 27,25 (Beat 15 dieses Schluss-Parts): alles blendet in einer Achtel (0,5 Beat = 349 ms) auf
    # Schwarz und bleibt bis Takt 27,5 dunkel. Damit das geht, sind hier auch die Wellen eine Ebene (overlay, nur auf
    # der Matrix, über Schwarz) und nicht mehr der Effekt des Parts: Ebene und Text haben beide das Zeitfenster
    # to: 15.5 (dort ist Schluss) mit fade_out: 0.5 (die letzte Achtel davor blendet aus). Die anderen Geräte sind
    # ohnehin dunkel, der Blinder von Takt 26,5 ist bei 27 schon ausgeklungen.
    # Der Text liegt in der Text-Ebene über den Wellen (over: true), und pulse steht IM text - so klingt nur das Wort
    # ab, nicht die Wellen. under: 30 = solange das Wort voll da ist, sind die Wellen auf 30 % gedimmt.
    tail:
      beats: 16
      fx: "progBlack(${dur}, ${next})"
      overlay:
        devices: {matrix: "progWaterRipple(${dur}, ${next}, 50, true, false)"}
        to: 15.5
        fade_out: 0.5
      text: {words: "THE*3 NERDS*3 ON*2", per: half, color: weiss, over: true, pulse: {depth: 100, per: 6}, under: 30, to: 15.5, fade_out: 0.5}
      blinder:
        - {at: 0, len: 2, hold: 0.5, amount: 100}
        - {at: 6, len: 2, hold: 0.5, amount: 100}
        - {at: 12, len: 2, hold: 0.5, amount: 100}
    cues:
      20: "voller warmweißer Blinder auf allen Geräten auf der 1, klingt über 1 Takt aus (bis Takt 21)"
      21.5: "Blinder, klingt über 1 Takt aus (bis Takt 22,5)"
      23.5: "voller warmweißer Blinder auf allen Geräten (1,4 Sekunden), dazu \"THE\" weiß auf der Matrix über den Wellen: springt auf, blendet über 1,5 Takte aus"
      25: "Blinder + \"NERDS\" weiß auf der Matrix, gleiche Form"
      26.5: "Blinder + \"ON\" weiß auf der Matrix, gleiche Form (bis zum STOP bei Takt 27,25)"
      27.25: "STOP: Wellen und \"ON\" auf der Matrix blenden in einer Achtel auf Schwarz; alle Geräte bleiben bis Takt 27,5 dunkel"
    why: "Auf der Matrix laufen die Wasserwellen weiter (der Titel-Lauftext kommt erst nach dem Sprung im Song). Blinder bei Takt 20 und 21,5, je über einen Takt ausklingend. Ab Takt 23,5 dreimal im Abstand von 1,5 Takten: Blinder auf allen Geräten und ein Wort weiß über den Wellen - THE, NERDS, ON. Bei Takt 27,25 STOP: alles blendet in einer Achtel auf Schwarz. Alle anderen Geräte sind dunkel."

  "strobo":
    # Erste Viertel (Takt 27,5): Blinder auf allen Geräten, springt auf dem Schlag auf, steht eine Achtel voll und
    # ist am Ende der Viertel - wenn der Strobo beginnt - wieder aus. Auf der Matrix steht "FIRE" weiß über den
    # Wellen (per: bar ist länger als die Viertel = das Wort steht durchgehend, ohne Pulsieren).
    fx: "progBlack(${dur}, ${next})"
    devices:
      matrix: "progWaterRipple(${dur}, ${next}, 50, true, false)"
    text: {words: "FIRE", per: bar, color: weiss, over: true, under: 30}
    blinder: {at: 0, len: 1, hold: 0.5, amount: 100}
    # Zweite Viertel (Takt 27,75) als eigener Schluss-Part: Strobo, "FIRE" schwarz ausgestanzt - die Buchstaben
    # bleiben dunkel, drumherum blitzt der Strobo.
    tail:
      beats: 1
      fx: "progStrobo(${dur}, ${next}, 83, getRandomColor(), getRandomColor(), getRandomColor())"
      text: {words: "FIRE", per: bar, over: true, color: schwarz}
    cues:
      27.75: "Strobo in Zufallsfarben auf allen Geräten (eine Viertel); auf der Matrix ist \"FIRE\" schwarz aus dem Strobo ausgestanzt. Danach ohne Pause in den Band-Einsatz von All The Things She Said (Stern in Neon)"
    why: "Takt 27,5: voller warmweißer Blinder auf allen Geräten (eine Viertel) und \"FIRE\" weiß auf der Matrix über den Wellen. Takt 27,75: Strobo in Zufallsfarben auf allen Geräten, \"FIRE\" schwarz ausgestanzt. Bei Takt 28 ohne Pause in den Band-Einsatz von All The Things She Said."
