# Technische Show (von Claude aus quelle/struktur.xlsx abgeleitet, 18.10.2026).
# Erste generierte Fassung des handgeschriebenen Songs BloodyMary() (Song-ID 10). Der alte Code bleibt in src/songs.cpp
# stehen, in main.cpp ist nur sein Aufruf auskommentiert (Wunsch des Users, 18.10.2026: "für alle noch nicht
# generierten songs jetzt den song neu generieren. dabei die vorschläge der KI übernehmen. den alten code erstmal nur
# auskommentieren!").
# Gestaltung: die Vorschläge aus vorschlag.yaml (10.10.2026, Spalte "Neuer Vorschlag (KI)"). Leitidee: dunkel und
# "blutig" - Rot als Erkennungsfarbe (dance dance, Schluss), Strophen in Blau/Lila. "dance dance" ist ein festes Motiv
# (3x gleich), der Chorus bleibt der Stern. Parts ohne Vorschlag behalten ihren alten Effekt; Strobo nach der Regel
# des Users nicht mit progStrobo, sondern als weiße Fläche + gate (läuft im Takt, auf allen gleich).
# why: steht bei jeder Generierung in der Spalte "Effekt (füllt KI)" der Tabelle - deshalb beschreibt es, was man sieht.
# Bund-Marker: der alte Code setzt in BloodyMary() keine Marker in einzelnen Parts; die Grund-Marker im case von
# src/markerLEDs.cpp gelten unverändert - deshalb hier kein markers:-Block.
# Kein Trailer springt in diesen Song. Schluss-Black 10 s: steht in der Tabelle in der Zeile "Ende".
# Taktnummern (bar:) zählen wie die Tabelle ab 1 (DAW Cakewalk).

function: gen_BloodyMary
scheme: SCHEME_ROYAL

# Bausteine für die 8 Paare "git vs synth" (YAML-Anker: &name legt fest, *name / <<: *name setzt ein)
git_strobe: &git
  scene: SCENE_COLORS
  scheme: SCHEME_WHITE
  gate: 4
  only: {devices: [guitar], others: 0}
  why: "Die Gitarre antwortet: weißer Strobo im Takt (4 Blitze pro Beat) nur auf Gitarre und Bass, Lampen und Matrix dunkel."
synth_sparkle: &synth
  scene: SCENE_SPARKLE
  scheme: SCHEME_NEON
  only: {devices: [lamp, matrix], others: 0}
  why: "Der Synth antwortet: schnelle Einzelblitze in Pink, Cyan und Violett nur auf Lampen und Matrix, Gitarre und Bass dunkel."
dance: &dance
  scene: SCENE_CALL_RESPONSE
  scheme: SCHEME_RETRO
  text: {words: "DANCE", over: true}
  why: "Motiv 'dance dance': die Bühnenhälften blitzen abwechselnd im Beat in Rot, Weiß und Blau; auf der Matrix pulsiert DANCE im Beat über der Szene."

sections:
  "BLACK":
    fx: "progBlack(${dur}, ${next})"
    why: "Alles schwarz bis zum Einsatz (die Matrix zeigt den Titel-Lauftext)."

  "synth intro":
    scene: SCENE_GLOW
    scheme: SCHEME_ROYAL
    fade: {to: triad, per: 8}
    why: "Dunkler Einstieg: die Geräte füllen sich langsam in Blau und Lila, die Farben wandern alle 2 Takte nach Pink und zurück."

  "verse 1":
    scene: SCENE_RAIN
    scheme: SCHEME_RED
    transition: {type: fade, beats: 2}
    why: "Blutrote fallende Leuchtspuren, weich eingeblendet."

  "dance dance": *dance

  "chorus 1":
    scene: SCENE_STAR
    scheme: SCHEME_NEON
    soft: 40
    blinder: {at: 0, len: 2, amount: 100}
    why: "Drehender Stern in Pink, Cyan und Violett, die Farben blenden weich ineinander; warmweißer Blinder auf den Einsatz (2 Beats)."

  "chorus instrumental":
    fx: "progFastBlingBling(${dur}, 3, ${next})"
    why: "Schnelle bunte Einzelblitze (wie bisher)."

  "FX":
    fx: "progBlack(${dur}, ${next})"
    blinder: {at: 0, len: 4, amount: 100}
    why: "Atempause vor verse 2: Schwarz, ein warmweißer Blinder springt auf die 1 (Takt 38) und klingt über den ganzen Takt aus."

  "verse 2":
    scene: SCENE_DNA_FLIP_SCROLL
    scheme: SCHEME_ROYAL
    why: "DNA-Helix in Blau und Lila wandert langsam über die Matrix, die Stränge tauschen jeden Takt die Seiten; alle anderen Geräte pulsieren einmal je Takt."

  "dance dance (2)": *dance

  "chorus 1 (2)":
    scene: SCENE_STAR
    scheme: SCHEME_NEON
    soft: 40
    blinder:
      - {at: 0, len: 2, amount: 100}
      - {every: 2, at: 1, len: 0.5, color: weiss, devices: [LAMPE1, LAMPE2]}
    why: "Stern wie in chorus 1 mit Blinder auf den Einsatz, eine Stufe mehr: die Lampen blitzen zusätzlich weiß auf 2 und 4."

  "synth break":
    scene: SCENE_COLORS_WAVE
    scheme: SCHEME_NEON
    soft: 60
    why: "Die Farbe wandert pro Beat weich von Gerät zu Gerät über die Bühne, Pink, Cyan und Violett."

  "git vs synth (git)": *git
  "git vs synth (synth)": *synth
  "git vs synth (git) (2)": *git
  "git vs synth (synth) (2)": *synth
  "git vs synth (git) (3)": *git
  "git vs synth (synth) (3)": *synth
  "git vs synth (git) (4)": *git
  "git vs synth (synth) (4)": *synth
  "git vs synth (git) (5)": *git
  "git vs synth (synth) (5)": *synth
  "git vs synth (git) (6)": *git
  "git vs synth (synth) (6)": *synth
  "git vs synth (git) (7)": *git
  "git vs synth (synth) (7)": *synth
  "git vs synth (git) (8)": *git
  "git vs synth (synth) (8)":
    <<: *synth
    blinder: {bar: 74.75, len: 1, hold: 0.5, amount: 100}
    why: "Der Synth antwortet ein letztes Mal (Einzelblitze nur auf Lampen und Matrix); starker Blinder auf die letzte Viertel (Takt 74,75) als Absprung ins Instrumental."

  "instrumental":
    fx: "progWaterRipple(${dur}, ${next}, 50, true, true)"
    transition: {type: fade, beats: 2}
    why: "Wasserringe (wie bisher), weich eingeblendet."

  "dance dance (3)":
    <<: *dance
    overlay: {scene: SCENE_SPARKLE, amount: 40, fade_in: 32}
    why: "Motiv 'dance dance' (Bühnenhälften abwechselnd in Rot, Weiß, Blau, DANCE auf der Matrix); darüber baut sich über den ganzen Part ein Glitzern auf - Anlauf zum letzten Chorus."

  "chorus a":
    scene: SCENE_STAR
    scheme: SCHEME_FIRE
    blinder:
      - {at: 0, len: 2, amount: 100}
      - {bar: 94.5, len: 0.8, attack: 0.2, hold: 0.2, amount: 100}
      - {bar: 94.75, len: 0.8, attack: 0.2, hold: 0.2, amount: 100}
      - {bar: 95, len: 0.8, attack: 0.2, hold: 0.2, amount: 100}
    why: "Drehender Stern, eine Stufe wärmer in Rot, Orange und Gelb; Blinder auf den Einsatz, am Ende des 4. Takts drei kurze Blinder auf drei Vierteln (Takt 94,5 / 94,75 / 95)."

  "chorus b":
    scene: SCENE_SPARKLE
    scheme: SCHEME_FIRE
    blinder: {bar: 106.75, len: 4, hold: 0.5, amount: 100, carry: true}
    why: "Dichtes Glitzern in Rot, Orange und Gelb; starker Blinder auf der letzten Viertel (Takt 106,75), der ins Outro ausklingt."

  "outro":
    scene: SCENE_FADEOUT
    scheme: SCHEME_RED
    why: "Rot, blendet über die 2 Takte weich nach Schwarz."
