# Technische Show (von Claude aus song.yaml + Analyse abgeleitet).
# Struktur: quelle/struktur.xlsx des Users (29 Parts). Es gelten durchgehend sein energy und seine Effektideen.
# Idee: drei wiederkehrende Motive gliedern den Song -
#   Chorus "all the things she said"  = drehender Stern (SCENE_STAR)
#   Hook "this is not enough"         = Schläge auf die Viertel in Rot (SCENE_DROP), jedes Mal gleich
#   Übergang in den Chorus            = weißer Strobo
# Farben: A-Moll -> kalt (ICE/ROYAL/BLUE) in Intro, Verses und Bridge, Chorus in NEON, die Hook rot;
# nach dem Stopp kippt das Finale ins Warme (SUNSET -> FIRE).
# Abweichung zur Messung: die ersten 4 Takte des Intros sind in der MP3 ein leiser Chant (power 1, -19,9 dB),
# der User setzt für die ganzen 8 Takte energy 4 "action" -> gilt.

function: gen_AllTheThingsSheSaid
scheme: SCHEME_ICE

sections:
  pause:
    fx: "progBlack(${dur}, ${next})"

  "intro: all thet ….":
    scene: SCENE_STAR
    scheme: SCHEME_ICE
    why: "Idee 'action', energy 4: das Intro ist die Chorus-Melodie - der Stern stellt den Chorus-Look vor, noch in kaltem Eisblau"

  "intro: this is not enough":
    scene: SCENE_DROP
    scheme: SCHEME_RED
    why: "Idee 'action stark auf viertel', energy 5: Schockwellen und Blitze auf jeden Beat, Farbe bricht auf Rot um - das Motiv der Hook für den ganzen Song"

  verse 1a:
    scene: SCENE_GLOW
    scheme: SCHEME_ICE
    why: "Idee 'sehr ruhig', energy 1: nach dem roten Ausbruch füllt sich alles langsam mit Eisblau, größter Kontrast im Song"

  verse 1b:
    scene: SCENE_RAIN
    scheme: SCHEME_ICE
    why: "Idee 'etwas gesteigert', energy 2: fallende Leuchtspuren bringen Bewegung, bleiben aber ruhig und kalt (Regen passt zum Song)"

  "wiederholung: nobody else":
    scene: SCENE_BUILDUP
    scheme: SCHEME_ICE
    why: "Idee 'build up': lädt sich über die 3 Beats auf, Explosion genau auf den Strobo-Schlag"

  übergang zum chorus:
    fx: "progStrobo(${dur}, ${next}, 60, CRGB::White)"
    why: "Idee 'strobo': 1 Beat weißes Flimmern als Absprung in den Chorus"

  chorus 1:
    scene: SCENE_STAR
    scheme: SCHEME_NEON
    why: "Idee 'action', energy 4: der Stern in Pink/Cyan/Violett, Farbwechsel pro Beat - der Refrain-Look"

  this is not enough:
    scene: SCENE_DROP
    scheme: SCHEME_RED
    why: "Hook wie im Intro: Schläge auf die Viertel in Rot, eine Stufe über dem Chorus (energy 5)"

  synth solo a:
    scene: SCENE_COLORS
    scheme: SCHEME_RANDOM
    why: "Idee 'viele farben und im takt': die ganze Bühne einfarbig, pro Beat eine neue freie Zufallsfarbe - der bunteste Part"

  synth solo b:
    scene: SCENE_COLORS_WAVE
    scheme: SCHEME_RANDOM
    why: "Idee 'etwas gesteigert auf den takt': gleiche Farben, jetzt wandert die Farbe pro Beat von Gerät zu Gerät über die Bühne"

  verse 2 a:
    scene: SCENE_PALETTE
    scheme: SCHEME_ROYAL
    why: "Idee 'ruhig', energy 2: ein Farbband in Blau/Lila/Weiß zieht in 4 Takten einmal über die Bühne - ruhig, aber eine Stufe mehr als Verse 1a"

  verse 2 b:
    scene: SCENE_VERSE
    scheme: SCHEME_ROYAL
    why: "Idee 'etwas gesteigert', energy 3: jetzt Puls im Beat (Zonen der Gitarre, Lichtschuss in den Lampen), gleiche Farben"

  verse 2 b - build up:
    scene: SCENE_BUILDUP
    scheme: SCHEME_ICE
    why: "Idee 'build up', energy 4: 1,5 Takte Aufladen, Explosion auf den Strobo"

  übergang zum chorus (2):
    fx: "progStrobo(${dur}, ${next}, 60, CRGB::White)"
    why: "Strobo-Absprung wie beim ersten Mal, hier 2 Beats"

  chorus 1 (2):
    scene: SCENE_STAR
    scheme: SCHEME_NEON
    why: "Chorus erkennbar gleich wie beim ersten Mal"

  this is not enough (2):
    scene: SCENE_DROP
    scheme: SCHEME_RED
    why: "Hook-Motiv: Viertel in Rot"

  Mother looking at me:
    scene: SCENE_CALM
    scheme: SCHEME_BLUE
    why: "Idee 'sehr ruhig', energy 1: tiefster Punkt des Songs - alles atmet in Blau, auf der Matrix langsame Wasserringe"

  daddy looking at me:
    scene: SCENE_RAIN
    scheme: SCHEME_ROYAL
    why: "Idee 'etwas gesteigert', energy 2: Leuchtspuren setzen ein, Lila und Weiß kommen dazu"

  build up:
    scene: SCENE_BUILDUP
    scheme: SCHEME_ICE
    why: "Idee 'build up': Aufladen wie vor Chorus 2"

  übergang zum chorus (3):
    fx: "progStrobo(${dur}, ${next}, 60, CRGB::White)"
    why: "Strobo-Absprung, 2 Beats"

  chorus 1 (3):
    scene: SCENE_STAR
    scheme: SCHEME_SUNSET
    why: "der Chorus setzt für 2 Beats an - schon in den warmen Farben des Finales"

  stop:
    fx: "progBlack(${dur}, ${next})"
    why: "Idee 'BLACK': 2 Beats Dunkel machen den Wiedereinsatz stärker"

  chorus 1 weiter:
    scene: SCENE_STAR
    scheme: SCHEME_SUNSET
    why: "letzter Chorus eine Stufe wärmer: Stern in Orange/Pink/Lila/Gelb"

  this is not enough (3):
    scene: SCENE_DROP
    scheme: SCHEME_FIRE
    why: "Hook-Motiv gesteigert: Viertel jetzt in Rot/Orange/Gelb"

  übergang zum chorus (4):
    fx: "progStrobo(${dur}, ${next}, 60, CRGB::White)"
    why: "Idee 'strobe': letzter Absprung"

  chrorus 2:
    scene: SCENE_SPARKLE
    scheme: SCHEME_FIRE
    why: "Höhepunkt am Songende: 2 Takte schnelle Einzelblitze auf allen Geräten in Feuerfarben, statt ein viertes Mal der Stern"

  this is not enough (4):
    scene: SCENE_DROP
    scheme: SCHEME_FIRE
    why: "die Hook zum letzten Mal, Viertel in Feuerfarben"

  fade out:
    scene: SCENE_CALM
    scheme: SCHEME_RED
    why: "Idee 'fade out': ein Takt rotes Aufatmen und Ausklingen, danach 10 s schwarz"
