# Technische Show (von Claude aus quelle/struktur.xlsx abgeleitet, 06.10.2026).
# Auftrag des Users: die Part-Längen neu aus der Tabelle rechnen, damit die Geräte synchron bleiben - das Aussehen
# bleibt. Deshalb stehen hier alle Parts 1:1 mit dem alten Effekt aus IWannaDanceWithSomebody() (Spalte
# "bisher (alter Code)") als fx:. Der alte Code bleibt in src/songs.cpp. Kein Farbschema: freie Zufallsfarben wie bisher.
# Zeiten in den Effekten, die im alten Code von Hand gerundete Beats waren (480 ms = 1 Beat, 964 ms = 2 Beats,
# 1925 ms = 1 Takt bei 124 BPM), stehen als ${beat} / ${half} / ${bar} (484 / 968 / 1935 ms). 120 ms und 100 ms bleiben.
# why: steht bei jeder Generierung in der Spalte "Effekt (füllt KI)" der Tabelle - deshalb beschreibt es, was man sieht.
# Bund-Marker: stehen von Hand in src/markerLEDs.cpp (case 27) und gelten unverändert. Dort werden ab dem Part
# "übergang chorus (3)" (transponierter Teil) die Marker 1 und 4 ausgeschaltet - die Grenze steht in markerLEDs.cpp als
# Konstante GEN_IWANNADANCEWITHSOMEBODY_UEBERGANG_CHORUS_3 (früher feste Part-Nummer 52; mit OK des Users umgestellt,
# die Marker selbst sind unverändert). Wird dieser Part in der Tabelle umbenannt, bricht der Build - dann die
# Konstante dort anpassen. Kein Trailer springt in diesen Song.
# Titel-Lauftext mit 80 ms pro Pixel wie im alten Code.

function: gen_IWannaDanceWithSomebody
scroll_delay: 80
# Wunsch des Users 02.11.2026: "am Ende noch ein Blinder rein, aktuell hört der Song einfach nur so auf". Der Blinder
# auf der letzten Viertel von "...bdy who loves me" steht bis zum Part-Ende voll, end_blinder lässt ihn 5 Sekunden
# lang ins Schluss-Schwarz ausklingen (wie bei APT).
end_blinder: 5

sections:
  "pause":
    fx: "progBlack(${dur}, ${next})"
    why: "Alles schwarz bis zum Einsatz (die Matrix zeigt den Titel-Lauftext)."

  "strobo":
    fx: "progStrobo(${dur}, ${next}, 100, getRandomCRGB())"
    why: "Alter Effekt: harter Strobo (100 ms) in Zufallsfarbe."

  "intro":
    fx: "progPalette(${dur}, 6, ${next})"
    why: "Alter Effekt: weiße Wellen, weich an- und abschwellend."

  "strobo (2)":
    fx: "progStrobo(${dur}, ${next}, 100, getRandomCRGB())"
    why: "Alter Effekt: harter Strobo (100 ms) in Zufallsfarbe."

  "verse 1":
    # Strophen-Abwechslung (02.11.2026, Wunsch des Users: weniger SCENE_VERSE, weniger kühles Blau). Vorher:
    #   scene: SCENE_VERSE, scheme: SCHEME_SUNSET
    # Zurück: songgen.py IWannaDanceWithSomebody_v1 --restore <Version davor> (siehe --versions) oder diese Zeilen zurücksetzen.
    # Test 1 (02.11.2026): SCENE_VERSE_HEART, SCHEME_FIRE, fade analog - Urteil: viel zu hektisch -> halbes Tempo + Farbwechsel
    scene: SCENE_VERSE_HEART_SLOW
    scheme: SCHEME_FIRE
    why: "Strophe als ruhiger, warmer Herzschlag (lub-dub nur auf jedem zweiten Beat): Matrix EKG-Linie wie auf einem Herzmonitor, Gitarre/Bass Korpus + Puls den Hals hinauf, Lampen ganz; mit jedem Takt rückt jedes Gerät eine Farbe weiter (Rot, Orange, Gelb)"

  "ive done alright":
    fx: "progMatrixScanner(${dur}, ${next}, 30)"
    why: "Alter Effekt: ruhiger Scanner, eine Leuchtlinie fährt hin und her."

  "übergang chorus":
    fx: "progStrobo(${dur}, ${next}, 100, getRandomCRGB())"
    why: "Alter Effekt: harter Strobo (100 ms) in Zufallsfarbe."

  "chorus 1":
    fx: "progSternNeu(${dur}, ${bar}, ${next}, 5, 26, 5, false, 4)"
    why: "Alter Effekt: drehender Stern, fest in der Mitte, Farbwechsel jeden Takt."

  "w. smbdy who loves me":
    fx: "progStrobo(${dur}, ${next}, 100, getRandomCRGB())"
    why: "Alter Effekt: harter Strobo (100 ms) in Zufallsfarbe."

  "chorus 1 weiter":
    fx: "progSternNeu(${dur}, ${bar}, ${next}, 5, 26, 5, true, 3)"
    why: "Alter Effekt: drehender, wandernder Stern, Farbwechsel jeden Takt."

  "w. smbdy who loves me (2)":
    fx: "progFastBlingBling(${dur}, 6, ${next})"
    why: "Alter Effekt: schnelle Einzelblitze."

  "stehender chord":
    fx: "progStrobo(${dur}, ${next}, 100, getRandomCRGB())"
    why: "Alter Effekt: harter Strobo (100 ms) in Zufallsfarbe."

  "übergang verse":
    fx: "progMatrixHorizontal(${dur}, ${next}, 70, true)"
    why: "Alter Effekt: 1 Takt Leuchtspuren, die nach Weiß aufhellen."

  "verse 2":
    # Vorher (seit 18.10.2026): SCENE_VERSE_HEART - Urteil des Users 02.11.2026: viel zu hektisch -> halbes Tempo + Farbwechsel
    scene: SCENE_VERSE_HEART_SLOW
    scheme: SCHEME_NEON
    why: "'somebody who loves me' - alle Geräte schlagen ruhig wie ein Herz (nur auf jedem zweiten Beat) in Pink/Cyan/Violett, mit jedem Takt rückt jedes Gerät eine Farbe weiter; die Matrix zeigt eine EKG-Linie wie auf einem Herzmonitor"

  "ive done alright (2)":
    fx: "progPalette(${dur}, 9, ${next})"
    why: "Alter Effekt: rot-weiß-blaue Blöcke mit Lücken, harte Kanten."

  "übergang chorus (2)":
    fx: "progStrobo(${dur}, ${next}, 100, getRandomCRGB())"
    why: "Alter Effekt: harter Strobo (100 ms) in Zufallsfarbe."

  "chorus 2":
    fx: "progSternNeu(${dur}, ${bar}, ${next}, 5, 26, 5, false, 4)"
    why: "Alter Effekt: drehender Stern, fest in der Mitte, Farbwechsel jeden Takt."

  "w. smbdy who loves me (3)":
    fx: "progFastBlingBling(${dur}, 6, ${next})"
    why: "Alter Effekt: schnelle Einzelblitze."

  "chorus 2 weiter":
    fx: "progSternNeu(${dur}, ${bar}, ${next}, 5, 26, 5, true, 3)"
    why: "Alter Effekt: drehender, wandernder Stern, Farbwechsel jeden Takt."

  "w. smbdy who loves me (4)":
    fx: "progStrobo(${dur}, ${next}, 100, getRandomCRGB())"
    why: "Alter Effekt: harter Strobo (100 ms) in Zufallsfarbe."

  "Say you wanna dance":
    fx: "progFastBlingBling(${dur}, 6, ${next})"
    # Wunsch des Users 02.11.2026: "DANCE" auf den Takten 79,5 / 81,5 / 83,5, je einen halben Takt, knallige Farbe mit
    # Rand, der sich vom Hintergrund absetzt. Part beginnt bei Takt 78 -> Beats 6-8, 14-16, 22-24. Über den hellen
    # Einzelblitzen hilft ein schwarzer Rand (outline: true) am meisten, die Blitze darunter sind dabei auf 15 % gedimmt.
    # per: 64 = länger als der Part, das Wort steht in seinem Fenster ruhig statt zu pulsieren.
    text: {words: "DANCE", per: 64, color: pink, over: true, outline: true, windows: [[6, 8], [14, 16], [22, 24]]}
    why: "Schnelle Einzelblitze; auf den Takten 79,5, 81,5 und 83,5 steht auf der Matrix je einen halben Takt DANCE in knalligem Pink mit schwarzem Rand, die Blitze darunter gedimmt."

  "übergang":
    fx: "progMatrixHorizontal(${dur}, ${next}, 70, true)"
    why: "Alter Effekt: 1 Takt Leuchtspuren, die nach Weiß aufhellen."

  "i need a man …":
    fx: "progPalette(${dur}, 12, ${next})"
    why: "Alter Effekt: Farbband mit Palette 12. Diese Palette ist im Code nicht definiert - zu sehen ist die zuletzt geladene (hier die rot-weiß-blaue aus \"ive done alright\")."

  "übergang chorus (3)":
    fx: "progStrobo(${dur}, ${next}, 100, getRandomCRGB())"
    why: "Alter Effekt: harter Strobo (100 ms) in Zufallsfarbe. Ab hier (transponierter Teil) sind die Bund-Marker 1 und 4 aus."

  "chorus 3":
    fx: "progSternNeu(${dur}, ${half}, ${next}, 5, 26, 5, false, 4)"
    why: "Alter Effekt: drehender Stern, fest in der Mitte, Farbwechsel alle 2 Beats."

  "w. smbdy who loves me (5)":
    fx: "progStrobo(${dur}, ${next}, 100, getRandomCRGB())"
    why: "Alter Effekt: harter Strobo (100 ms) in Zufallsfarbe."

  "chorus 3 weiter":
    fx: "progSternNeu(${dur}, ${beat}, ${next}, 5, 26, 5, true, 3)"
    why: "Alter Effekt: drehender, wandernder Stern, Farbwechsel pro Beat."

  "w. smbdy who loves me (6)":
    fx: "progStrobo(${dur}, ${next}, 100, getRandomCRGB())"
    why: "Alter Effekt: harter Strobo (100 ms) in Zufallsfarbe."

  "Say you wanna dance (2)":
    fx: "progRandomLines(${dur}, ${next}, 120, true)"
    why: "Alter Effekt: sehr schnell wechselnde zufällige Linien (alle 120 ms, eine Sechzehntel)."

  "strobe":
    fx: "progFastBlingBling(${dur}, 4, ${next})"
    # Wunsch 02.11.2026: DANCE auf Takt 110,5 für einen halben Takt - der Part beginnt eine Achtel früher (x,375),
    # also Beat 0,5 bis 2,5 = genau bis zum Part-Ende. Aussehen wie in "Say you wanna dance".
    text: {words: "DANCE", per: 64, color: pink, over: true, outline: true, windows: [[0.5, 2.5]]}
    why: "Schnelle Einzelblitze; ab Takt 110,5 steht auf der Matrix einen halben Takt DANCE in knalligem Pink mit schwarzem Rand, die Blitze darunter gedimmt."

  "Say you wanna dance (3)":
    fx: "progRandomLines(${dur}, ${next}, 120, true)"
    why: "Alter Effekt: sehr schnell wechselnde zufällige Linien (alle 120 ms, eine Sechzehntel)."

  "strobe (2)":
    fx: "progFastBlingBling(${dur}, 6, ${next})"
    # Wunsch 02.11.2026: DANCE auf Takt 112,5 für einen halben Takt - der Part beginnt eine Achtel früher (x,375),
    # also Beat 0,5 bis 2,5 = genau bis zum Part-Ende. Aussehen wie in "Say you wanna dance".
    text: {words: "DANCE", per: 64, color: pink, over: true, outline: true, windows: [[0.5, 2.5]]}
    why: "Schnelle Einzelblitze; ab Takt 112,5 steht auf der Matrix einen halben Takt DANCE in knalligem Pink mit schwarzem Rand, die Blitze darunter gedimmt."

  "Say you wanna dance (4)":
    fx: "progRandomLines(${dur}, ${next}, 120, true)"
    why: "Alter Effekt: sehr schnell wechselnde zufällige Linien (alle 120 ms, eine Sechzehntel)."

  "strobe (3)":
    fx: "progFastBlingBling(${dur}, 8, ${next})"
    # Wunsch 02.11.2026: DANCE auf Takt 114,5 für einen halben Takt - der Part beginnt eine Achtel früher (x,375),
    # also Beat 0,5 bis 2,5 = genau bis zum Part-Ende. Aussehen wie in "Say you wanna dance".
    text: {words: "DANCE", per: 64, color: pink, over: true, outline: true, windows: [[0.5, 2.5]]}
    why: "Schnelle Einzelblitze; ab Takt 114,5 steht auf der Matrix einen halben Takt DANCE in knalligem Pink mit schwarzem Rand, die Blitze darunter gedimmt."

  "w. some…":
    fx: "progSternNeu(${dur}, ${beat}, ${next}, 5, 26, 5, false, 4)"
    why: "Alter Effekt: drehender Stern, fest in der Mitte, Farbwechsel pro Beat."

  "...bdy who loves me":
    fx: "progFastBlingBling(${dur}, 10, ${next})"
    blinder: {at: 3, len: 2, hold: 1}    # voll bis Part-Ende, end_blinder klingt aus
    why: "Alter Effekt: schnelle Einzelblitze. Auf der letzten Viertel ein voller warmweißer Blinder auf allen Geräten, der nach dem Schlussakkord 5 Sekunden lang ins Schwarz ausklingt."
