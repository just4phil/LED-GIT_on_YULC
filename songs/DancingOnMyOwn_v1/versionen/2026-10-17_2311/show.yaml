# Technische Show (Claude) für Dancing On My Own - Robyn, 122 BPM.
# Angelegt am 17.10.2026 aus dem bis dahin "eingefrorenen" generated.cpp (entstanden am 03.10.2026 aus der alten
# song.yaml, die es im Ablauf nicht mehr gibt). Szenen und Farbschemata sind Part für Part übernommen, damit der Song
# erst einmal genauso aussieht wie bisher. Abweichungen vom alten Code:
#   - "bridge" (Takt 56) steht in der Tabelle als eigener Part (im alten Code lief verse 2 bis Takt 60 durch): gestaltet
#     wie der erste Pre-Chorus "yeah i knwo ist stupid" (4 Takte vor dem Chorus, gleicher Formteil -> gleicher Look).
#   - "outro" (Takt 136, 2 Takte) ist neu (der alte Code war dort schon schwarz): blendet weich aus.
#   - Strobo-Absprünge (Tails) im Takt über gate statt progStrobo: progStrobo zählt mit eigenem Zähler und würfelt mit
#     getRandomCRGB() je Gerät eine eigene Farbe (Regel des Users: solche Effekte müssen immer auf dem Beat sein).
# Idee: kühler Anfang (ICE/ROYAL), der Pre-Chorus wärmt in SUNSET auf, NEON ist die Farbe der Chorusse, die
# Gitarre bekommt im Instrumental RETRO (rot/weiß/blau), das Finale steigert sich über FIRE und SUNSET.
# Marker: case 8 in src/markerLEDs.cpp (gilt unverändert). Trailer: INTROdancing (#81) springt in "chorus 1"
# (GEN_DANCINGONMYOWN_CHORUS_1 in src/songs.cpp).

function: gen_DancingOnMyOwn
scheme: SCHEME_NEON

sections:
  black:
    fx: "progBlack(${dur}, ${next})"

  bass:
    scene: SCENE_CALM
    scheme: SCHEME_ICE
    why: "nur Synth-Bass: alle Geräte atmen langsam in Blau, dunkel und kühl"

  somebody:
    scene: SCENE_VERSE
    scheme: SCHEME_ICE
    why: "Gesang setzt ein: Gitarre und Bass leuchten Zone für Zone im Beat, Lampen mit Lichtschuss pro Beat, auf der Matrix farbiger Regen in Blautönen"

  git steigt ein:
    scene: SCENE_VERSE
    scheme: SCHEME_ROYAL
    devices:
      ANDRESGIT: "progSymmetricVU(${dur}, ${next}, ${bpm})"
    why: "Gitarre steigt ein und bekommt ein eigenes VU, der Rest bleibt im Verse-Puls, Farben Blau/Violett"

  yeah i knwo ist stupid:
    scene: SCENE_BUILDUP
    scheme: SCHEME_SUNSET
    why: "Pre-Chorus: lädt sich über 4 Takte in warmen Farben auf und entlädt sich genau auf den Chorus"

  chorus 1:
    scene: SCENE_DROP
    scheme: SCHEME_NEON
    why: "erster Chorus: volle Energie im Beat in Pink, Türkis und Violett"

  chorus 1b:
    scene: SCENE_WAVE_LR
    why: "Blitz läuft auf jedem Beat von links nach rechts über die Bühne"

  i keep dancing:
    scene: SCENE_PINGPONG
    tail:
      beats: 2
      scene: SCENE_COLORS
      gate: 4
    why: "'on my own' springt pro Beat von Gerät zu Gerät; die letzten 2 Beats Strobo im Takt als Absprung in den Stopp"

  pause vor verse 2a:
    fx: "progBlack(${dur}, ${next})"
    why: "Stopp: alles dunkel"

  verse 2b:
    scene: SCENE_VERSE
    scheme: SCHEME_ROYAL
    why: "zurück in den Puls, eine Stufe wärmer als Verse 1 (Blau/Violett), auf der Matrix farbiger Regen"

  bridge:
    scene: SCENE_BUILDUP
    scheme: SCHEME_SUNSET
    why: "wie der erste Pre-Chorus: lädt sich über 4 Takte in warmen Farben auf und entlädt sich genau auf den Chorus"

  chorus 1 (2):
    scene: SCENE_DROP
    scheme: SCHEME_NEON
    why: "zweiter Chorus wie der erste: volle Energie im Beat in Neonfarben"

  chorus 1b (2):
    scene: SCENE_WAVE_RL
    why: "Blitzwelle diesmal von rechts nach links"

  i keep dancing (2):
    scene: SCENE_PINGPONG
    why: "'on my own' springt pro Beat von Gerät zu Gerät"

  instrumental:
    scene: SCENE_SOLO_GIT
    scheme: SCHEME_RETRO
    why: "Gitarre im Spotlight, rot/weiß/blau wie im Original"

  so far away:
    scene: SCENE_CALM
    scheme: SCHEME_ICE
    devices:
      matrix: "matrixMovieFX(${dur}, ${next}, 100, 6)"
    why: "alles zieht sich zurück und atmet in Blau, auf der Matrix ein dünner Matrix-Regen (6 Spuren) wie im Original"

  im in the corner:
    fx: "progBlack(${dur}, ${next})"
    why: "Stille vor dem Finale"

  snarewirbel:
    scene: SCENE_BUILDUP
    scheme: SCHEME_WHITE
    why: "1 Takt weißes Aufladen, die Explosion fällt genau auf den Einsatz"

  chorus 1 (3):
    scene: SCENE_FIRE
    scheme: SCHEME_FIRE
    why: "Finale beginnt: Feuer auf allen Geräten"

  i keep dancing (3):
    scene: SCENE_WAVE_OUT
    scheme: SCHEME_FIRE
    why: "Blitz läuft pro Beat von der Mitte nach außen, in Feuerfarben"

  chorus 1 (4):
    scene: SCENE_DROP
    scheme: SCHEME_SUNSET
    why: "volle Energie im Beat in Orange, Pink, Violett und Gold"

  chorus 1b (3):
    scene: SCENE_PINGPONG
    scheme: SCHEME_SUNSET
    why: "Licht springt pro Beat von Gerät zu Gerät, Sonnenuntergangsfarben"

  i keep dancing (4):
    scene: SCENE_WAVE_LR
    scheme: SCHEME_SUNSET
    why: "Blitzwelle von links nach rechts, Sonnenuntergangsfarben"

  i keep dancing (5):
    scene: SCENE_FIRE
    scheme: SCHEME_FIRE
    tail:
      beats: 4
      scene: SCENE_COLORS
      scheme: SCHEME_WHITE
      gate: 4
    why: "Höhepunkt: Feuer auf allen Geräten, der letzte Takt weißer Strobo im Takt"

  instrumental (2):
    scene: SCENE_CALM
    scheme: SCHEME_SUNSET
    why: "ausatmen: alle Geräte atmen langsam in warmen Farben"

  outro:
    scene: SCENE_FADEOUT
    scheme: SCHEME_SUNSET
    why: "die letzten 2 Takte blenden weich nach Schwarz"
