# Technische Show (Claude) für Dancing On My Own - Robyn, 122 BPM.
# Angelegt am 17.10.2026 aus dem bis dahin "eingefrorenen" generated.cpp (entstanden am 03.10.2026 aus der alten
# song.yaml, die es im Ablauf nicht mehr gibt). Szenen und Farbschemata sind Part für Part übernommen, damit der Song
# erst einmal genauso aussieht wie bisher. Abweichungen vom alten Code:
#   - "bridge" (Takt 56) steht in der Tabelle als eigener Part (im alten Code lief verse 2 bis Takt 60 durch): gestaltet
#     wie der erste Pre-Chorus "yeah i knwo ist stupid" (4 Takte vor dem Chorus, gleicher Formteil -> gleicher Look).
#   - "outro" (Takt 136, 2 Takte) ist neu (der alte Code war dort schon schwarz): blendet weich aus.
#   - Strobo-Absprünge (Tails) im Takt über gate statt progStrobo: progStrobo zählt mit eigenem Zähler und würfelt mit
#     getRandomCRGB() je Gerät eine eigene Farbe (Regel des Users: solche Effekte müssen immer auf dem Beat sein).
# Idee: kühler Anfang (ICE/ROYAL), der Pre-Chorus wärmt in SUNSET auf, NEON ist die Farbe der Chorusse, die
# Gitarre bekommt im Instrumental RETRO (rot/weiß/blau), das Finale steigert sich über FIRE und SUNSET.
# Marker: case 8 in src/markerLEDs.cpp (gilt unverändert). Trailer: INTROdancing (#81) springt in "chorus 1"
# (GEN_DANCINGONMYOWN_CHORUS_1 in src/songs.cpp).

function: gen_DancingOnMyOwn
scheme: SCHEME_NEON

sections:
  black:
    fx: "progBlack(${dur}, ${next})"

  bass:
    scene: SCENE_CALM
    scheme: SCHEME_ICE
    why: "nur Synth-Bass: alle Geräte atmen langsam in Blau, dunkel und kühl"

  somebody:
    scene: SCENE_VERSE_HEART
    scheme: SCHEME_ICE
    devices:
      # Wunsch des Users 02.11.2026: Lampen, Gitarre und Bass blinkten zu schnell für den ruhigen Start -> halbes
      # Tempo (ein Herzschlag alle 2 Beats, bleibt auf dem Beat: 61 BPM = genau jeder zweite Beat von 122)
      lamp: "progLampHeartbeat(${dur}, ${next}, ${bpm} / 2, deviceColor())"
      guitar: "progHeartbeat(${dur}, ${next}, ${bpm} / 2, deviceColor())"
      # EKG-Linie auf der Matrix (02.11.2026) ebenfalls mit Schlag nur jeden zweiten Beat, passend zu den anderen
      matrix: "progEcgBeat(${dur}, ${next}, ${bpm}, deviceColor(), 2)"
    why: "Gesang setzt ein, noch zurückhaltend: Gitarre, Bass und Lampen schlagen ruhig wie ein Herz (lub-dub) auf jedem zweiten Beat in Blautönen, die Matrix zeigt eine EKG-Linie wie auf einem Herzmonitor"

  git steigt ein:
    # Strophen-Abwechslung (02.11.2026, Wunsch des Users: weniger SCENE_VERSE, weniger kühles Blau). Vorher:
    #   scene: SCENE_VERSE, scheme: SCHEME_ROYAL
    # Zurück: songgen.py DancingOnMyOwn_v1 --restore <Version davor> (siehe --versions) oder diese Zeilen zurücksetzen.
    scene: SCENE_DNA
    scheme: SCHEME_NEON
    devices:
      ANDRESGIT: "progSymmetricVU(${dur}, ${next}, ${bpm})"
    why: "Gitarre steigt ein und bekommt ein eigenes VU; Matrix eine drehende DNA-Doppelhelix in Pink/Cyan, Bass und Lampen pulsieren dazu weich im Wechsel der Bühnenhälften"

  yeah i knwo ist stupid:
    scene: SCENE_BUILDUP
    scheme: SCHEME_SUNSET
    why: "Pre-Chorus: lädt sich über 4 Takte in warmen Farben auf und entlädt sich genau auf den Chorus"

  chorus 1:
    scene: SCENE_DROP
    scheme: SCHEME_NEON
    why: "erster Chorus: volle Energie im Beat in Pink, Türkis und Violett"

  chorus 1b:
    scene: SCENE_WAVE_LR
    why: "Blitz läuft auf jedem Beat von links nach rechts über die Bühne"

  i keep dancing:
    scene: SCENE_PINGPONG
    tail:
      beats: 2
      scene: SCENE_COLORS
      gate: 4
    why: "'on my own' springt pro Beat von Gerät zu Gerät; die letzten 2 Beats Strobo im Takt als Absprung in den Stopp"

  pause vor verse 2a:
    fx: "progBlack(${dur}, ${next})"
    why: "Stopp: alles dunkel"

  verse 2b:
    scene: SCENE_VERSE_WAVES
    scheme: SCHEME_ROYAL
    why: "zurück in den Puls, eine Stufe wärmer als Verse 1 (Blau/Violett): Sinuswellen laufen im Takt über die Matrix, eine Lichtebene fährt je Takt über Gitarre und Bass, Lichtschuss in den Lampen"

  bridge:
    scene: SCENE_BUILDUP
    scheme: SCHEME_SUNSET
    why: "wie der erste Pre-Chorus: lädt sich über 4 Takte in warmen Farben auf und entlädt sich genau auf den Chorus"

  chorus 1 (2):
    scene: SCENE_DROP
    scheme: SCHEME_NEON
    why: "zweiter Chorus wie der erste: volle Energie im Beat in Neonfarben"

  chorus 1b (2):
    scene: SCENE_WAVE_RL
    why: "Blitzwelle diesmal von rechts nach links"

  i keep dancing (2):
    scene: SCENE_PINGPONG
    why: "'on my own' springt pro Beat von Gerät zu Gerät"

  instrumental:
    scene: SCENE_SOLO_GIT
    scheme: SCHEME_RETRO
    why: "Gitarre im Spotlight, rot/weiß/blau wie im Original"

  so far away:
    scene: SCENE_CALM
    scheme: SCHEME_ICE
    devices:
      matrix: "matrixMovieFX(${dur}, ${next}, 100, 6)"
    why: "alles zieht sich zurück und atmet in Blau, auf der Matrix ein dünner Matrix-Regen (6 Spuren) wie im Original"

  im in the corner:
    fx: "progBlack(${dur}, ${next})"
    why: "Stille vor dem Finale"

  snarewirbel:
    scene: SCENE_BUILDUP
    scheme: SCHEME_WHITE
    why: "1 Takt weißes Aufladen, die Explosion fällt genau auf den Einsatz"

  chorus 1 (3):
    scene: SCENE_FIRE
    scheme: SCHEME_FIRE
    why: "Finale beginnt: Feuer auf allen Geräten"

  i keep dancing (3):
    scene: SCENE_WAVE_OUT
    scheme: SCHEME_FIRE
    why: "Blitz läuft pro Beat von der Mitte nach außen, in Feuerfarben"

  chorus 1 (4):
    scene: SCENE_DROP
    scheme: SCHEME_SUNSET
    why: "volle Energie im Beat in Orange, Pink, Violett und Gold"

  chorus 1b (3):
    scene: SCENE_PINGPONG
    scheme: SCHEME_SUNSET
    why: "Licht springt pro Beat von Gerät zu Gerät, Sonnenuntergangsfarben"

  i keep dancing (4):
    scene: SCENE_WAVE_LR
    scheme: SCHEME_SUNSET
    why: "Blitzwelle von links nach rechts, Sonnenuntergangsfarben"

  i keep dancing (5):
    scene: SCENE_FIRE
    scheme: SCHEME_FIRE
    tail:
      beats: 4
      scene: SCENE_COLORS
      scheme: SCHEME_WHITE
      gate: 4
    why: "Höhepunkt: Feuer auf allen Geräten, der letzte Takt weißer Strobo im Takt"

  # Bass-Outro (Wunsch des Users 02.11.2026): der Bass spielt das Ende fast allein -> Fokus auf den Bass.
  # 128 alle atmen, 130 der Rest verlischt in 2 Takten, 132 nur der Bass mit ruhigem Farbverlauf, 136 der Verlauf
  # bleibt stehen und verlischt in 1 Takt, 137 still.
  instrumental (2):
    scene: SCENE_CALM
    scheme: SCHEME_SUNSET
    why: "ausatmen: alle Geräte atmen langsam in warmen Farben"

  bass allein:
    scene: SCENE_CALM
    scheme: SCHEME_SUNSET
    only: {devices: RINASBASS, fade: 8}
    transition: {type: fade, beats: 1}
    why: "der Bass spielt allein weiter: er atmet weiter, alle anderen Geräte verlöschen langsam über 2 Takte"

  bass solo:
    fx: "progBlack(${dur}, ${next})"
    scheme: SCHEME_SUNSET
    devices:
      # eine Umdrehung = 16 Beats = genau dieser Part (4 Takte): am Ende steht der Verlauf wieder wie am Anfang,
      # darum passt das stehende Bild im outro ohne Sprung. 255 = kein Anschwellen im Beat, ruhig.
      RINASBASS: "progSpatialPalette(${dur}, ${next}, ${bpm}, 7869UL, 255)"
    transition: {type: fade, beats: 2}
    why: "nur der Bass: ein Farbverlauf in Orange, Pink, Violett und Gold dreht sich ruhig um den Korpus (eine Runde in 4 Takten), alle anderen schwarz"

  outro:
    fx: "progBlack(${dur}, ${next})"
    scheme: SCHEME_SUNSET
    devices:
      # riesige Umdrehungszeit = der Verlauf steht still, im Bild vom Ende des Parts davor
      RINASBASS: "progSpatialPalette(${dur}, ${next}, ${bpm}, 4000000000UL, 255)"
    fade_out: 4
    why: "der Farbverlauf auf dem Bass bleibt stehen und verlischt in einem Takt"

  stille:
    fx: "progBlack(${dur}, ${next})"
    why: "Stille bis zum Ende"
