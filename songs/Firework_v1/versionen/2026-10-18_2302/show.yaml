# Technische Show (von Claude aus quelle/struktur.xlsx abgeleitet, 18.10.2026).
# Erste generierte Fassung des handgeschriebenen Songs Firework() (Song-ID 7). Der alte Code bleibt in src/songs.cpp
# stehen, in main.cpp ist nur sein Aufruf auskommentiert (Wunsch des Users, 18.10.2026: "für alle noch nicht
# generierten songs jetzt den song neu generieren. dabei die vorschläge der KI übernehmen. den alten code erstmal nur
# auskommentieren!").
# Gestaltung: die Vorschläge aus vorschlag.yaml (10.10.2026, Spalte "Neuer Vorschlag (KI)"). Leitidee: der Song heißt
# Firework - Strophen kühl (ROYAL), jeder Chorus eine Stufe heißer (SUNSET -> Feuer-Szene -> FIRE), die BOOM-Parts mit
# Blindern auf die 1. Der Vorschlag "bei Takt 21 eine eigene Zeile verse 1b" ist umgesetzt (songgen.py --part-name
# 21="verse 1b"). Parts ohne Vorschlag behalten ihren alten Effekt; Strobo nach der Regel des Users nicht mit
# progStrobo, sondern als weiße Fläche + gate (läuft im Takt, auf allen gleich).
# why: steht bei jeder Generierung in der Spalte "Effekt (füllt KI)" der Tabelle - deshalb beschreibt es, was man sieht.
# Bund-Marker: der alte Code setzt in Firework() keine Marker in einzelnen Parts; die Grund-Marker im case von
# src/markerLEDs.cpp gelten unverändert - deshalb hier kein markers:-Block.
# Kein Trailer springt in diesen Song. Schluss-Black 10 s: steht in der Tabelle in der Zeile "Ende".
# Taktnummern (bar:) zählen wie die Tabelle ab 1 (DAW Cakewalk).

function: gen_Firework
scheme: SCHEME_ROYAL
end_blinder: 5    # der Blinder auf der letzten Viertel klingt 5 Sekunden lang ins Schluss-Schwarz aus (wie in APT.)

# Wiederkehrende Bausteine (YAML-Anker: &name legt fest, *name / <<: *name setzt ein)
strobe: &strobe
  scene: SCENE_COLORS
  scheme: SCHEME_WHITE
  gate: 4
  why: "Weißer Strobo im Takt (4 Blitze pro Beat) als Absprung."
ignite: &ignite
  scene: SCENE_PALETTE
  scheme: SCHEME_SUNSET
  overlay: {scene: SCENE_SPARKLE, amount: 40, fade_in: 28}
  why: "'ignite the light': ein Farbband in Orange, Pink, Lila und Gelb läuft über die ganze Bühne, darüber baut sich über den ganzen Part ein Glitzern auf."
firework_text: &fwtext {words: "FIREWORK", per: 30, over: true, to: 8, fade_out: 2}

sections:
  "text":
    fx: "progBlack(${dur}, ${next})"
    why: "Alles schwarz bis zum Einsatz."

  "snarewirbel": *strobe

  "intro1":
    scene: SCENE_STAR
    scheme: SCHEME_ROYAL
    soft: 60
    why: "Ruhiger Anfang: drehender Stern in Blau, Lila und Weiß, die Farben fließen weich ineinander."

  "verse 1a":
    scene: SCENE_GLOW
    scheme: SCHEME_ROYAL
    fade: {to: triad, per: 8}
    why: "Die Geräte füllen sich langsam in Blau und Lila, die Farben wandern alle 2 Takte nach Pink/Orange und zurück."

  "verse 1b":
    scene: SCENE_RAIN
    scheme: SCHEME_ROYAL
    fade: {to: analog, per: 8}
    why: "Kleine Steigerung: fallende Leuchtspuren in Blau und Lila, die Farbe wandert alle 2 Takte leicht weiter."

  "bridge": *ignite

  "übergang": *strobe

  "chorus 1":
    scene: SCENE_STAR
    scheme: SCHEME_SUNSET
    blinder: {at: 0, len: 2, amount: 100}
    text: *fwtext
    why: "Drehender Stern in Orange, Pink, Lila und Gelb, warmweißer Blinder auf den Einsatz; auf der Matrix FIREWORK über dem Stern, blendet nach 2 Takten aus."

  "übergang (2)": *strobe

  "verse 2a":
    scene: SCENE_COLORS
    scheme: SCHEME_NEON
    soft: 30
    why: "Die ganze Bühne in einer Farbe, pro Beat die nächste (Pink, Cyan, Violett), mit kurzer Blende."

  "verse 2b":
    scene: SCENE_CALL_RESPONSE
    scheme: SCHEME_NEON
    why: "Steigerung: die Bühnenhälften blitzen abwechselnd im Beat in Pink, Cyan und Violett."

  "bridge (2)": *ignite

  "übergang (3)": *strobe

  "chorus 2a":
    scene: SCENE_FIRE
    scheme: SCHEME_FIRE
    blinder: {at: 0, len: 2, amount: 100}
    text: *fwtext
    why: "Feuer auf allen Geräten in Rot, Orange und Gelb, warmweißer Blinder auf den Einsatz; auf der Matrix FIREWORK, blendet nach 2 Takten aus."

  "übergang (4)": *strobe

  "BOOM 1":
    scene: SCENE_DROP
    scheme: SCHEME_SUNSET
    blinder: {every: 4, at: 0, len: 2, amount: 100}
    why: "'boom boom boom': Schläge auf die Viertel in warmen Farben, dazu ein warmweißer Blinder auf jede 1 (jeder Takt, 2 Beats)."

  "nur vocals":
    scene: SCENE_CALM
    scheme: SCHEME_BLUE
    dim: 50
    transition: {type: fade, beats: 4}
    why: "Die Bühne tritt zurück, nur die Stimme: ruhiges Atmen in Blau, halb hell, weich eingeblendet."

  "BOOM 3":
    scene: SCENE_WAVE_OUT
    scheme: SCHEME_SUNSET
    blinder: {bar: 93, len: 2, amount: 100}
    why: "Der Blitz läuft pro Beat von der Mitte nach außen, in warmen Farben; warmweißer Blinder auf die 1 (Takt 93)."

  "BOOM 4":
    fx: "progWaterRipple(${dur}, ${next}, 50, true, false)"
    overlay: {scene: SCENE_SPARKLE, amount: 40, fade_in: 28}
    why: "Wasserringe (wie bisher), darüber baut sich ein Glitzern auf - Anlauf zum Finale."

  "strobo snarewirbel":
    scene: SCENE_BUILDUP
    scheme: SCHEME_FIRE
    why: "Lädt sich einen Takt lang in Rot, Orange und Gelb auf, Explosion genau auf den Chorus."

  "chorus 2a (2)":
    scene: SCENE_STAR
    scheme: SCHEME_FIRE
    blinder:
      - {at: 0, len: 2, amount: 100}
      - {every: 2, at: 1, len: 0.5, color: weiss, devices: [LAMPE1, LAMPE2]}
    why: "Drehender Stern in Rot, Orange und Gelb, Blinder auf den Einsatz; die Lampen blitzen weiß auf 2 und 4."

  "übergang (5)": *strobe

  "chorus 2":
    scene: SCENE_SPARKLE
    scheme: SCHEME_FIRE
    blinder:
      - {bar: 124, len: 0.8, attack: 0.2, hold: 0.2, amount: 100}
      - {bar: 124.25, len: 0.8, attack: 0.2, hold: 0.2, amount: 100}
    why: "Höhepunkt: dichtes Glitzern in Rot, Orange und Gelb; am Ende kurze Blinder auf den Vierteln (Takt 124 / 124,25, der dritte auf 124,5 im Snarewirbel)."

  "strobo snarewirbel (2)":
    fx: "progBlack(${dur}, ${next})"
    blinder:
      - {bar: 124.5, len: 0.8, attack: 0.2, hold: 0.2, amount: 100}
      - {bar: 124.75, len: 2, hold: 1, amount: 100}
    why: "Schwarz mit dem dritten kurzen Blinder (Takt 124,5); auf der letzten Viertel (Takt 124,75) springt ein starker Blinder auf und klingt 5 Sekunden ins Schluss-Schwarz aus."
