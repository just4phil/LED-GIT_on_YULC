    scheme: SCHEME_SUNSET
    blinder: {at: 0, len: 1, hold: 0.75}
    why: "Riff-Motiv (Viertel an, Viertel aus), jetzt wärmer in Orange, Pink, Lila und Gelb. Warmweißer Blinder auf den Einsatz, eine Viertel lang."

  "verse 3":
