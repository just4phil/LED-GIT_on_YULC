# Technische Show (von Claude aus quelle/struktur.xlsx abgeleitet, 09.10.2026).
# Vorspann (Einspieler) zu "I Love It": erste generierte Fassung des handgeschriebenen ILoveItTRAILER() (Song-ID 80).
# Der alte Code bleibt in src/songs.cpp stehen. Der Einspieler ist fast durchgehend dunkel; umgesetzt sind die
# Änderungswünsche aus den Zwischenzeilen der Tabelle (09.10.2026):
#   pause              Takt 4, 5, 6, 7: je ein kurzer starker Blinder (auf dem Schlag voll, am Ende der Viertel dunkel)
#                      Takt 10,5 / 11: Feuer-Impuls erst auf Lampe 1, dann auf Lampe 2 (progLampFireBurst, neu für diesen
#                      Wunsch: ganze Lampe sofort in voller Flamme, klingt in einem halben Takt ab)
#   text nerds on fire Takt 13 und 15: kurzer starker Blinder; der Lauftext "Nerds on Fire" läuft wie bisher
#   pause (2)          Takt 33: kurzer starker Blinder
#   text songtitel     Takt 37, 39, 41: Blinder + ein Wort auf der Matrix, das über 2 Takte ausblendet
# Zweite Runde Wünsche (09.10.2026, die erledigten hat der User aus der Tabelle gelöscht - sie bleiben umgesetzt):
#   pause              Takt 7: dieser Blinder klingt lang über 2 Takte aus
#   pause (2)          Takt 33: der Blinder klingt lang über 1,5 Takte aus - das reicht 0,25 Takt über das Part-Ende
#                      hinaus, deshalb carry: true (er klingt im Part danach zu Ende)
#   text songtitel     die drei Wörter sind jetzt THE (37) / NERDS (39) / ON (41)
#   strobo             "FIRE" schwarz ausgestanzt über dem Strobo - zusammen: THE NERDS ON FIRE
# Annahmen von Claude, noch nicht vom User bestätigt:
#   - "auf der Achtel (10,55)" ist wörtlich genommen: Takt 10,55 = 100 ms nach der Viertel 10,5 (die Achtel wäre 10,625)
# Entscheidung des Users (09.10.2026): der Titel-Lauftext "I love it by Icona Pop" läuft nicht mehr im Vorspann,
# sondern am Anfang des eigentlichen Songs - auf der Matrix ab dem Einstieg in "chorus 1" (trailer_entry in
# songs/ILoveIt_v1/show.yaml). Deshalb hier scroll_text: false; das erlaubt auch die Akzente im ersten Part.
# Schluss: kein Schluss-Black (Zeile "Ende" der Tabelle: 0 sek.), next_song springt ohne Pause nach Song #9.
# why: steht bei jeder Generierung in der Spalte "Effekt (füllt KI)" der Tabelle - deshalb beschreibt es, was man sieht.
# Bund-Marker: stehen von Hand in src/markerLEDs.cpp (case 80) und gelten unverändert - deshalb hier kein markers:-Block.
# Taktnummern (bar:, cues:, ${bar:...}) zählen wie die Tabelle ab 1.

function: gen_ILoveItIntro
scroll_text: false
next_song: ILoveIt_v1

sections:
  "pause":
    fx: "progBlack(${dur}, ${next})"
    # Feuer-Impulse: nur auf den beiden Lampen, alle anderen Geräte bleiben schwarz. ${bar:...} = Zeitpunkt der
    # Taktnummer in ms seit Part-Beginn, ${beats:2} = ein halber Takt Ausklingen.
    devices:
      LAMPE1: "progLampFireBurst(${dur}, ${next}, ${bar:10.55}, ${beats:2})"
      LAMPE2: "progLampFireBurst(${dur}, ${next}, ${bar:11}, ${beats:2})"
    # "kurzer starker Blinder (am Ende der Viertel wieder dunkel)": springt auf dem Schlag voll auf, steht 0,3 Beat
    # (150 ms) und ist nach genau einer Viertel (500 ms) wieder aus. Der vierte (Takt 7) klingt stattdessen lang
    # über 2 Takte aus (Wunsch 09.10.2026): erst schnell dunkler, dann lange auslaufend.
    blinder:
      - {bar: 4, len: 1, hold: 0.3, amount: 100}
      - {bar: 5, len: 1, hold: 0.3, amount: 100}
      - {bar: 6, len: 1, hold: 0.3, amount: 100}
      - {bar: 7, len: 8, hold: 0.3, amount: 100}
    cues:
      4: "kurzer voller warmweißer Blinder auf allen Geräten: springt auf der 1 auf, 150 ms voll, am Ende der Viertel wieder dunkel"
      5: "Blinder auf der 1, gleiche Form"
      6: "Blinder auf der 1, gleiche Form"
      7: "voller warmweißer Blinder auf der 1, klingt lang über 2 Takte aus (bis Takt 9)"
      10.5: "Feuer-Impuls nur auf Lampe 1, bei Takt 10,55 (100 ms nach dieser Viertel): ganze Lampe sofort in voller Flamme, klingt in einem halben Takt ab"
      11: "Feuer-Impuls nur auf Lampe 2 auf die 1: ganze Lampe sofort in voller Flamme, klingt in einem halben Takt ab"
    why: "Alles dunkel, der Einspieler läuft. Kurze Blinder auf die 1 von Takt 4, 5 und 6, auf Takt 7 einer, der lang über 2 Takte ausklingt; am Ende ein Feuer-Impuls auf Lampe 1 und gleich danach auf Lampe 2."

  "text nerds on fire":
    fx: "progBlack(${dur}, ${next})"
    devices:
      matrix: "progScrollText(\"Nerds on Fire\", ${dur}, 90, getRandomColor(), ${next})"
    blinder:
      - {bar: 13, len: 1, hold: 0.3, amount: 100}
      - {bar: 15, len: 1, hold: 0.3, amount: 100}
    cues:
      13: "kurzer voller warmweißer Blinder auf allen Geräten: springt auf der 1 auf, 150 ms voll, am Ende der Viertel wieder dunkel"
      15: "Blinder auf der 1, gleiche Form"
    why: "Nur die Matrix zeigt den Lauftext \"Nerds on Fire\" (wie bisher), alle anderen Geräte sind dunkel. Kurze Blinder auf die 1 von Takt 13 und 15."

  "pause (2)":
    fx: "progBlack(${dur}, ${next})"
    # 1,5 Takte Ausklingen ab Takt 33 enden bei 34,5 - der Part aber schon bei 34,25. carry: true lässt den Blinder im
    # Part danach ("text songtitel") die letzten 500 ms zu Ende klingen statt abzureißen.
    blinder: {bar: 33, len: 6, hold: 0.3, amount: 100, carry: true}
    cues:
      33: "voller warmweißer Blinder auf allen Geräten auf der 1, klingt lang über 1,5 Takte aus (bis Takt 34,5, über die Part-Grenze hinweg)"
    why: "Alles dunkel. Ein Blinder auf die 1 von Takt 33, der lang über 1,5 Takte ausklingt."

  "text songtitel":
    fx: "progBlack(${dur}, ${next})"
    # Ab Takt 37 (die letzten 22 Beats des Parts) als eigener Schluss-Part, damit die drei Einsätze auf seinem
    # 2-Takte-Raster liegen (Beat 0, 8, 16 = Takt 37, 39, 41): je Einsatz das nächste Wort weiß auf der Matrix
    # (THE, NERDS, ON - jedes 4 x 2 Beats = 2 Takte), pulse lässt das Bild alle 2 Takte voll aufspringen und bis auf
    # Schwarz abklingen (= Ausblenden über 2 Takte). Das dritte Wort hat bis zum Strobo nur noch 1,5 Takte. Die
    # Blinder liegen über allem und pulsieren nicht mit.
    tail:
      beats: 22
      fx: "progBlack(${dur}, ${next})"
      text: {words: "THE*4 NERDS*4 ON*4", per: half, color: weiss}
      pulse: {depth: 100, per: 8}
      blinder:
        - {at: 0, len: 2, hold: 0.5, amount: 100}
        - {at: 8, len: 2, hold: 0.5, amount: 100}
        - {at: 16, len: 2, hold: 0.5, amount: 100}
    cues:
      37: "voller warmweißer Blinder auf allen Geräten (1 Sekunde), dazu \"THE\" weiß auf der Matrix: springt auf, blendet über 2 Takte aus"
      39: "Blinder + \"NERDS\" weiß auf der Matrix, gleiche Form"
      41: "Blinder + \"ON\" weiß auf der Matrix; bis zum Strobo bleiben 1,5 Takte Ausblenden"
    why: "Alles dunkel bis Takt 37 (der Songtitel läuft jetzt erst am Anfang des eigentlichen Songs). Dann dreimal im Abstand von 2 Takten: Blinder auf allen Geräten und ein Wort auf der Matrix, das jeweils ausblendet - THE, NERDS, ON."

  "strobo":
    fx: "progStrobo(${dur}, ${next}, 83, getRandomColor(), getRandomColor(), getRandomColor())"
    # Wunsch (09.10.2026): "FIRE" schwarz ausgestanzt über dem Strobo. per: bar (länger als der Part) = das Wort steht
    # die ganze Sekunde, die Buchstaben bleiben dunkel, drumherum blitzt der Strobo.
    text: {words: "FIRE", per: bar, over: true, color: schwarz}
    why: "Alter Effekt: Strobo in Zufallsfarben auf allen Geräten ('I don't care'); auf der Matrix ist \"FIRE\" schwarz aus dem Strobo ausgestanzt. Danach ohne Pause in den Chorus von I Love It."
