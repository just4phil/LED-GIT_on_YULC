# Technische Show (von Claude aus quelle/struktur.xlsx abgeleitet, 09.10.2026).
# Vorspann (Einspieler) zu "I Love It": erste generierte Fassung des handgeschriebenen ILoveItTRAILER() (Song-ID 80).
# Der alte Code bleibt in src/songs.cpp stehen. Der Einspieler ist fast durchgehend dunkel; umgesetzt sind die
# Änderungswünsche aus den Zwischenzeilen der Tabelle (09.10.2026):
#   pause              Takt 4, 5, 6, 7: je ein kurzer starker Blinder (auf dem Schlag voll, am Ende der Viertel dunkel)
#                      Takt 10,5 / 11: Feuer-Impuls erst auf Lampe 1, dann auf Lampe 2 (progLampFireBurst, neu für diesen
#                      Wunsch: ganze Lampe sofort in voller Flamme, klingt in einem halben Takt ab)
#   text nerds on fire Takt 13 und 15: kurzer starker Blinder; der Lauftext "Nerds on Fire" läuft wie bisher
#   pause (2)          Takt 33: kurzer starker Blinder
#   text songtitel     Takt 37, 39, 41: Blinder + ein Wort auf der Matrix, das über 2 Takte ausblendet
# Zweite Runde Wünsche (09.10.2026, die erledigten hat der User aus der Tabelle gelöscht - sie bleiben umgesetzt):
#   pause              Takt 7: dieser Blinder klingt lang über 2 Takte aus
#   pause (2)          Takt 33: der Blinder klingt lang über 1,5 Takte aus - das reicht 0,25 Takt über das Part-Ende
#                      hinaus, deshalb carry: true (er klingt im Part danach zu Ende)
#   text songtitel     die drei Wörter sind jetzt THE (37) / NERDS (39) / ON (41)
#   strobo             "FIRE" schwarz ausgestanzt über dem Strobo - zusammen: THE NERDS ON FIRE
# Dritte Runde Wünsche (10.10.2026):
#   text nerds on fire Feuer-Impulse springen zwischen den Lampen hin und her: Lampe 1 bei Takt 12,55 / 16,55 / 18,55 /
#                      20,55 / 22,55, Lampe 2 bei Takt 14,55 / 17 / 19 / 21 / 23 (progLampFireBursts, neu für diesen
#                      Wunsch: mehrere Impulse je Part)
#   pause (2)          noch je ein Impuls: Lampe 1 bei Takt 24,55, Lampe 2 bei Takt 25
#   ab Takt 27         Wasserwellen (progWaterRipple) als Grundbild auf der Matrix unter allem, was folgt - bis zum
#                      Strobo. Takt 27 liegt mitten in "pause (2)", deshalb dort als Ebene mit Zeitfenster (from);
#                      in "text songtitel" ist es der Matrix-Effekt des Parts, die Wörter THE / NERDS / ON liegen als
#                      Text-Ebene darüber.
# Vierte Runde Wünsche (10.10.2026, die der dritten Runde hat der User aus der Tabelle gelöscht = angenommen):
#   pause (2)          die Reihe der Feuer-Impulse geht weiter: Lampe 1 bei Takt 26,55 / 28,55 / 30,55 / 32,55,
#                      Lampe 2 bei Takt 27 / 29 / 31
#   text songtitel     hier tauschen die Lampen die Rollen (so steht es in der Tabelle): Lampe 2 bei Takt 34,55 / 36,55 /
#                      40,55, Lampe 1 bei Takt 35 / 38,55. Die Impulse ab Takt 37 liegen im Schluss-Part (tail); dort gibt
#                      es kein ${bar:...}, deshalb stehen sie als Beats ab Takt 37 (38,55 = 6,2 Beats, 40,55 = 14,2 Beats).
# Annahmen von Claude, noch nicht vom User bestätigt:
#   - Zeitpunkt der Impulse wie in der ersten Runde: Lampe 1 (Zeilen x,5) 100 ms nach der Viertel = Takt x,55;
#     Lampe 2 in den Zeilen auf ganzen Takten (17, 19, 21, 23, 25) genau auf der 1 - dort steht "bei Takt 17,00" bzw.
#     keine eigene Taktangabe; nur in der Zeile 14,5 steht für Lampe 2 "bei Takt 14,55"
#   - der Strobo am Schluss (letzter halber Takt) bleibt auf der Matrix Strobo mit ausgestanztem "FIRE"; die Wellen
#     wären darunter nicht zu sehen
#   - die Wellen fangen an jeder Part-Grenze neu an (Takt 34,25 und 37): bei 34,25 blendet ein Übergang das alte
#     Wellenbild weich ins neue, bei 37 deckt der Blinder den Neustart zu
#   - "auf der Achtel (10,55)" ist wörtlich genommen: Takt 10,55 = 100 ms nach der Viertel 10,5 (die Achtel wäre 10,625)
# Entscheidung des Users (09.10.2026): der Titel-Lauftext "I love it by Icona Pop" läuft nicht mehr im Vorspann,
# sondern am Anfang des eigentlichen Songs - auf der Matrix ab dem Einstieg in "chorus 1" (trailer_entry in
# songs/ILoveIt_v1/show.yaml). Deshalb hier scroll_text: false; das erlaubt auch die Akzente im ersten Part.
# Schluss: kein Schluss-Black (Zeile "Ende" der Tabelle: 0 sek.), next_song springt ohne Pause nach Song #9.
# why: steht bei jeder Generierung in der Spalte "Effekt (füllt KI)" der Tabelle - deshalb beschreibt es, was man sieht.
# Bund-Marker: stehen von Hand in src/markerLEDs.cpp (case 80) und gelten unverändert - deshalb hier kein markers:-Block.
# Taktnummern (bar:, cues:, ${bar:...}) zählen wie die Tabelle ab 1.

function: gen_ILoveItIntro
scroll_text: false
next_song: ILoveIt_v1

sections:
  "pause":
    fx: "progBlack(${dur}, ${next})"
    # Feuer-Impulse: nur auf den beiden Lampen, alle anderen Geräte bleiben schwarz. ${bar:...} = Zeitpunkt der
    # Taktnummer in ms seit Part-Beginn, ${beats:2} = ein halber Takt Ausklingen.
    devices:
      LAMPE1: "progLampFireBurst(${dur}, ${next}, ${bar:10.55}, ${beats:2})"
      LAMPE2: "progLampFireBurst(${dur}, ${next}, ${bar:11}, ${beats:2})"
    # "kurzer starker Blinder (am Ende der Viertel wieder dunkel)": springt auf dem Schlag voll auf, steht 0,3 Beat
    # (150 ms) und ist nach genau einer Viertel (500 ms) wieder aus. Der vierte (Takt 7) klingt stattdessen lang
    # über 2 Takte aus (Wunsch 09.10.2026): erst schnell dunkler, dann lange auslaufend.
    blinder:
      - {bar: 4, len: 1, hold: 0.3, amount: 100}
      - {bar: 5, len: 1, hold: 0.3, amount: 100}
      - {bar: 6, len: 1, hold: 0.3, amount: 100}
      - {bar: 7, len: 8, hold: 0.3, amount: 100}
    cues:
      4: "kurzer voller warmweißer Blinder auf allen Geräten: springt auf der 1 auf, 150 ms voll, am Ende der Viertel wieder dunkel"
      5: "Blinder auf der 1, gleiche Form"
      6: "Blinder auf der 1, gleiche Form"
      7: "voller warmweißer Blinder auf der 1, klingt lang über 2 Takte aus (bis Takt 9)"
      10.5: "Feuer-Impuls nur auf Lampe 1, bei Takt 10,55 (100 ms nach dieser Viertel): ganze Lampe sofort in voller Flamme, klingt in einem halben Takt ab"
      11: "Feuer-Impuls nur auf Lampe 2 auf die 1: ganze Lampe sofort in voller Flamme, klingt in einem halben Takt ab"
    why: "Alles dunkel, der Einspieler läuft. Kurze Blinder auf die 1 von Takt 4, 5 und 6, auf Takt 7 einer, der lang über 2 Takte ausklingt; am Ende ein Feuer-Impuls auf Lampe 1 und gleich danach auf Lampe 2."

  "text nerds on fire":
    fx: "progBlack(${dur}, ${next})"
    devices:
      matrix: "progScrollText(\"Nerds on Fire\", ${dur}, 90, getRandomColor(), ${next})"
      # Feuer-Impulse im Wechsel (Wunsch 10.10.2026): progLampFireBursts(Dauer, Folge-Part, Ausklingen, Zeitpunkte...).
      # Jede Lampe bekommt nur ihre eigenen Zeitpunkte, dazwischen bleibt sie dunkel.
      LAMPE1: "progLampFireBursts(${dur}, ${next}, ${beats:2}, ${bar:12.55}, ${bar:16.55}, ${bar:18.55}, ${bar:20.55}, ${bar:22.55})"
      LAMPE2: "progLampFireBursts(${dur}, ${next}, ${beats:2}, ${bar:14.55}, ${bar:17}, ${bar:19}, ${bar:21}, ${bar:23})"
    blinder:
      - {bar: 13, len: 1, hold: 0.3, amount: 100}
      - {bar: 15, len: 1, hold: 0.3, amount: 100}
    cues:
      13: "kurzer voller warmweißer Blinder auf allen Geräten: springt auf der 1 auf, 150 ms voll, am Ende der Viertel wieder dunkel"
      15: "Blinder auf der 1, gleiche Form"
      12.5: "Feuer-Impuls nur auf Lampe 1, bei Takt 12,55 (100 ms nach dieser Viertel): ganze Lampe sofort in voller Flamme, klingt in einem halben Takt ab"
      14.5: "Feuer-Impuls nur auf Lampe 2, bei Takt 14,55 (100 ms nach dieser Viertel), gleiche Form"
      16.5: "Feuer-Impuls nur auf Lampe 1, bei Takt 16,55, gleiche Form"
      17: "Feuer-Impuls nur auf Lampe 2, genau auf der 1, gleiche Form"
      18.5: "Feuer-Impuls nur auf Lampe 1, bei Takt 18,55, gleiche Form"
      19: "Feuer-Impuls nur auf Lampe 2, genau auf der 1, gleiche Form"
      20.5: "Feuer-Impuls nur auf Lampe 1, bei Takt 20,55, gleiche Form"
      21: "Feuer-Impuls nur auf Lampe 2, genau auf der 1, gleiche Form"
      22.5: "Feuer-Impuls nur auf Lampe 1, bei Takt 22,55, gleiche Form"
      23: "Feuer-Impuls nur auf Lampe 2, genau auf der 1, gleiche Form"
    why: "Nur die Matrix zeigt den Lauftext \"Nerds on Fire\" (wie bisher), die Gitarren sind dunkel. Kurze Blinder auf die 1 von Takt 13 und 15. Ab Takt 12,5 springen Feuer-Impulse zwischen Lampe 1 und Lampe 2 hin und her (zehn Stück bis Takt 23)."

  "pause (2)":
    fx: "progBlack(${dur}, ${next})"
    # 1,5 Takte Ausklingen ab Takt 33 enden bei 34,5 - der Part aber schon bei 34,25. carry: true lässt den Blinder im
    # Part danach ("text songtitel") die letzten 500 ms zu Ende klingen statt abzureißen.
    blinder: {bar: 33, len: 6, hold: 0.3, amount: 100, carry: true}
    # Die Reihe der Feuer-Impulse aus dem Part davor läuft weiter (Wünsche 10.10.2026, dritte und vierte Runde):
    # Lampe 1 immer 100 ms nach der dritten Viertel (x,55), Lampe 2 auf der 1 des Takts danach.
    devices:
      LAMPE1: "progLampFireBursts(${dur}, ${next}, ${beats:2}, ${bar:24.55}, ${bar:26.55}, ${bar:28.55}, ${bar:30.55}, ${bar:32.55})"
      LAMPE2: "progLampFireBursts(${dur}, ${next}, ${beats:2}, ${bar:25}, ${bar:27}, ${bar:29}, ${bar:31})"
    # Wasserwellen ab Takt 27, nur auf der Matrix (Wunsch 10.10.2026). Takt 27 liegt mitten im Part (13,35 Beats nach
    # seinem Anfang bei Takt 23,6625), deshalb als Ebene mit Zeitfenster: from = ab hier sichtbar, fade_in = die
    # Wellen tauchen über 2 Beats auf statt aufzuspringen. Der Aufruf ist der, den die alten Songs fast immer nehmen
    # (50 ms je Schritt, Zufallsfarben mit Farbverlauf, Einschlagstellen zufällig verteilt).
    overlay:
      devices: {matrix: "progWaterRipple(${dur}, ${next}, 50, true, false)"}
      from: 13.35
      fade_in: 2
    cues:
      33: "voller warmweißer Blinder auf allen Geräten auf der 1, klingt lang über 1,5 Takte aus (bis Takt 34,5, über die Part-Grenze hinweg)"
      24.5: "Feuer-Impuls nur auf Lampe 1, bei Takt 24,55 (100 ms nach dieser Viertel): ganze Lampe sofort in voller Flamme, klingt in einem halben Takt ab"
      25: "Feuer-Impuls nur auf Lampe 2, genau auf der 1, gleiche Form"
      26.5: "Feuer-Impuls nur auf Lampe 1, bei Takt 26,55 (100 ms nach dieser Viertel): ganze Lampe sofort in voller Flamme, klingt in einem halben Takt ab"
      27: "Feuer-Impuls nur auf Lampe 2, genau auf der 1, gleiche Form. Ab hier außerdem Wasserwellen (progWaterRipple, bunte Ringe) nur auf der Matrix, tauchen über 2 Beats auf; sie laufen als Grundbild unter allem weiter bis zum Strobo"
      28.5: "Feuer-Impuls nur auf Lampe 1, bei Takt 28,55, gleiche Form"
      29: "Feuer-Impuls nur auf Lampe 2, genau auf der 1, gleiche Form"
      30.5: "Feuer-Impuls nur auf Lampe 1, bei Takt 30,55, gleiche Form"
      31: "Feuer-Impuls nur auf Lampe 2, genau auf der 1, gleiche Form"
      32.5: "Feuer-Impuls nur auf Lampe 1, bei Takt 32,55, gleiche Form"
    why: "Gitarren dunkel. Die Feuer-Impulse springen weiter zwischen Lampe 1 und Lampe 2 hin und her (neun Stück, Takt 24,5 bis 32,5). Ab Takt 27 laufen auf der Matrix Wasserwellen. Ein Blinder auf die 1 von Takt 33, der lang über 1,5 Takte ausklingt."

  "text songtitel":
    fx: "progBlack(${dur}, ${next})"
    # Die Wasserwellen von Takt 27 laufen auf der Matrix weiter (Wunsch 10.10.2026). Jeder Part startet den Effekt
    # neu; transition: fade blendet deshalb über 2 Beats vom letzten Wellenbild des Parts davor ins neue.
    # Feuer-Impulse (Wunsch 10.10.2026, vierte Runde): hier beginnt Lampe 2, Lampe 1 antwortet auf der 1 von Takt 35.
    devices:
      matrix: "progWaterRipple(${dur}, ${next}, 50, true, false)"
      LAMPE1: "progLampFireBurst(${dur}, ${next}, ${bar:35}, ${beats:2})"
      LAMPE2: "progLampFireBursts(${dur}, ${next}, ${beats:2}, ${bar:34.55}, ${bar:36.55})"
    transition: {type: fade, beats: 2}
    # Ab Takt 37 (die letzten 22 Beats des Parts) als eigener Schluss-Part, damit die drei Einsätze auf seinem
    # 2-Takte-Raster liegen (Beat 0, 8, 16 = Takt 37, 39, 41): je Einsatz das nächste Wort weiß auf der Matrix
    # (THE, NERDS, ON - jedes 4 x 2 Beats = 2 Takte), pulse lässt das Bild alle 2 Takte voll aufspringen und bis auf
    # Schwarz abklingen (= Ausblenden über 2 Takte). Das dritte Wort hat bis zum Strobo nur noch 1,5 Takte. Die
    # Blinder liegen über allem und pulsieren nicht mit.
    # Seit 10.10.2026 laufen darunter die Wasserwellen: der Text ist deshalb eine Ebene über dem Matrix-Effekt
    # (over: true), und pulse steht IM text - so klingt nur das Wort ab, nicht die Wellen. under: 30 = solange das
    # Wort voll da ist, sind die Wellen auf 30 % gedimmt (weiß auf bunt wäre sonst schlecht lesbar); mit dem
    # Ausblenden des Wortes kommen sie wieder hoch.
    tail:
      beats: 22
      fx: "progBlack(${dur}, ${next})"
      # Feuer-Impulse bei Takt 38,55 (Lampe 1) und 40,55 (Lampe 2). Im tail gibt es kein ${bar:...}: der Schluss-Part
      # beginnt bei Takt 37, also 1,55 Takte = 6,2 Beats und 3,55 Takte = 14,2 Beats nach seinem Anfang.
      devices:
        matrix: "progWaterRipple(${dur}, ${next}, 50, true, false)"
        LAMPE1: "progLampFireBurst(${dur}, ${next}, ${beats:6.2}, ${beats:2})"
        LAMPE2: "progLampFireBurst(${dur}, ${next}, ${beats:14.2}, ${beats:2})"
      text: {words: "THE*4 NERDS*4 ON*4", per: half, color: weiss, over: true, pulse: {depth: 100, per: 8}, under: 30}
      blinder:
        - {at: 0, len: 2, hold: 0.5, amount: 100}
        - {at: 8, len: 2, hold: 0.5, amount: 100}
        - {at: 16, len: 2, hold: 0.5, amount: 100}
    cues:
      37: "voller warmweißer Blinder auf allen Geräten (1 Sekunde), dazu \"THE\" weiß auf der Matrix: springt auf, blendet über 2 Takte aus"
      39: "Blinder + \"NERDS\" weiß auf der Matrix, gleiche Form"
      41: "Blinder + \"ON\" weiß auf der Matrix; bis zum Strobo bleiben 1,5 Takte Ausblenden"
      34.5: "Feuer-Impuls nur auf Lampe 2, bei Takt 34,55 (100 ms nach dieser Viertel): ganze Lampe sofort in voller Flamme, klingt in einem halben Takt ab"
      35: "Feuer-Impuls nur auf Lampe 1, genau auf der 1, gleiche Form"
      36.5: "Feuer-Impuls nur auf Lampe 2, bei Takt 36,55, gleiche Form"
      38.5: "Feuer-Impuls nur auf Lampe 1, bei Takt 38,55, gleiche Form"
      40.5: "Feuer-Impuls nur auf Lampe 2, bei Takt 40,55, gleiche Form"
    why: "Gitarren dunkel, auf der Matrix laufen die Wasserwellen weiter, auf den Lampen noch fünf Feuer-Impulse im Wechsel (Takt 34,5 bis 40,5). Ab Takt 37 dreimal im Abstand von 2 Takten: Blinder auf allen Geräten und ein Wort weiß auf der Matrix über den Wellen, das jeweils ausblendet - THE, NERDS, ON."

  "strobo":
    fx: "progStrobo(${dur}, ${next}, 83, getRandomColor(), getRandomColor(), getRandomColor())"
    # Wunsch (09.10.2026): "FIRE" schwarz ausgestanzt über dem Strobo. per: bar (länger als der Part) = das Wort steht
    # die ganze Sekunde, die Buchstaben bleiben dunkel, drumherum blitzt der Strobo.
    text: {words: "FIRE", per: bar, over: true, color: schwarz}
    why: "Alter Effekt: Strobo in Zufallsfarben auf allen Geräten ('I don't care'); auf der Matrix ist \"FIRE\" schwarz aus dem Strobo ausgestanzt. Danach ohne Pause in den Chorus von I Love It."
