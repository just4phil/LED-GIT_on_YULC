    soft: 100
    text: {words: "_*6 ALL*2 I*2 EVER*2 WANTED*12 _*6 ALL*2 I*2 EVER*2 NEEDED*9 IS*3 HERE*6 _*6 IN*6 MY*6 ARMS*24", per: 0.16667, color: weiss, over: true, outline: true, under: 40}
    cues: {92.25: "ALL, I, EVER je ein Drittel dieser Viertel", 92.5: "WANTED", 92.75: "WANTED bleibt stehen", 93.25: "ALL, I, EVER je ein Drittel dieser Viertel", 93.5: "NEEDED", 93.75: "NEEDED bis zur Achtel, dann IS", 94: "HERE", 94.5: "IN", 94.75: "MY", 95: "ARMS", 95.25: "ARMS", 95.5: "ARMS", 95.75: "ARMS"}
