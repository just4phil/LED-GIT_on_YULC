    scheme: SCHEME_WHITE
    text: {words: "WORDS ARE VERY*2 UN- NECESSARY*3 THEY*2 CAN_ONLY DO HARM*3 _", per: beat, color: rot, over: true, outline: true, under: 40}
    cues: {63.25: "ARE", 63.5: "VERY", 63.75: "VERY", 64: "UN-", 64.25: "NECESSARY", 64.5: "NECESSARY", 64.75: "NECESSARY", 65: "THEY", 65.25: "THEY", 65.5: "CAN ONLY als ein Bild", 65.75: "DO", 66: "HARM", 66.25: "HARM", 66.5: "HARM"}
