# Technische Show (von Claude aus quelle/struktur.xlsx abgeleitet, 18.10.2026).
# Erste generierte Fassung des handgeschriebenen Songs Maniac (Song-ID 30, bisher Maniac_Tminus1() - die Fassung
# einen Halbton tiefer). Der alte Code bleibt in src/songs.cpp stehen, in main.cpp ist nur sein Aufruf auskommentiert
# (Wunsch des Users, 18.10.2026: "für alle noch nicht generierten songs jetzt den song neu generieren. dabei die
# vorschläge der KI übernehmen. den alten code erstmal nur auskommentieren!").
# Gestaltung: die Vorschläge aus vorschlag.yaml (10.10.2026, Spalte "Neuer Vorschlag (KI)"). Leitidee: schnell und hell
# (157 BPM). Strophen in ROYAL/NEON, der Chorus als Stern in NEON, zum Schluss FIRE. Gegen die Länge der 14-Takte-
# Chorusse helfen Blinder und der Lampen-Backbeat; der Vorschlag "bei Takt 51 eine eigene Zeile chorus 1b" ist
# umgesetzt (songgen.py --part-name 51="chorus 1b"). Parts ohne Vorschlag behalten ihren alten Effekt; Strobo nach der
# Regel des Users nicht mit progStrobo, sondern als weiße Fläche + gate (läuft im Takt, auf allen gleich).
# why: steht bei jeder Generierung in der Spalte "Effekt (füllt KI)" der Tabelle - deshalb beschreibt es, was man sieht.
# Kein Trailer springt in diesen Song. Schluss-Black 10 s: steht in der Tabelle in der Zeile "Ende".
# Taktnummern (bar:) zählen wie die Tabelle ab 1 (DAW Cakewalk).

function: gen_Maniac
scheme: SCHEME_NEON
end_blinder: 5    # der Blinder auf der letzten Viertel klingt 5 Sekunden lang ins Schluss-Schwarz aus (wie in APT.)

# Bund-Marker aus Maniac_Tminus1() in src/songs.cpp: case 40 (instrumental a) und case 42 (instrumental b) setzen unter
# #ifdef GIT markerLED1..6 = ESaite_E, ESaite_Fis, 0, ESaite_B, ASaite_G, ASaite_Fis. Gegenüber den Grund-Markern im
# case 30 von src/markerLEDs.cpp ändert sich dabei nur Slot 3 (ESaite_G -> aus). Der alte Code schaltet ihn danach
# nicht wieder ein; hier gilt das "aus" für die beiden Instrumental-Parts, danach wieder die Grund-Marker.
markers:
  parts:
    "instrumental a": {guitar: {3: 0}}
    "instrumental b": {guitar: {3: 0}}

# Wiederkehrende Bausteine (YAML-Anker: &name legt fest, *name / <<: *name setzt ein)
strobe: &strobe
  scene: SCENE_COLORS
  scheme: SCHEME_WHITE
  gate: 4
  why: "Weißer Strobo im Takt (4 Blitze pro Beat)."
knife: &knife
  scene: SCENE_PALETTE
  scheme: SCHEME_SUNSET
  overlay: {scene: SCENE_SPARKLE, amount: 40, fade_in: 27}    # knapp unter den 7 Takten des Parts
  why: "'cut you like a knife': ein Farbband in Orange, Pink, Lila und Gelb läuft über die ganze Bühne, darüber baut sich über den ganzen Part ein Glitzern auf."
maniac_text: &mtext {words: "MANIAC", per: 60, over: true, to: 8, fade_out: 2}

sections:
  "pause":
    fx: "progBlack(${dur}, ${next})"
    why: "Alles schwarz bis zum Einsatz (die Matrix zeigt den Titel-Lauftext)."

  "drums intro":
    scene: SCENE_PINGPONG
    scheme: SCHEME_WHITE
    why: "Nur das Schlagzeug spielt: pro Beat leuchtet genau ein Gerät weiß auf, der Rest ist dunkel."

  "rock intro":
    fx: "progFastBlingBling(${dur}, 6, ${next})"
    transition: flash
    why: "Weißer Blitz auf den Band-Einsatz, danach schnelle bunte Einzelblitze (wie bisher)."

  "verse 1a":
    scene: SCENE_VERSE
    scheme: SCHEME_ROYAL
    why: "Strophe: dezenter Puls im Beat in Blau und Lila, auf der Matrix Wasserringe."

  "verse 1b":
    fx: "progRandomLines(${dur}, ${next}, ${beat}, false)"
    scheme: SCHEME_NEON
    why: "Linien stapeln sich, pro Beat eine neue, in Pink, Cyan und Violett."

  "it could cut you like a knife": *knife

  "uebergang":
    scene: SCENE_BUILDUP
    scheme: SCHEME_NEON
    why: "Lädt sich einen Takt lang in Pink, Cyan und Violett auf, Explosion genau auf den Chorus."

  "chorus 1":
    scene: SCENE_STAR
    scheme: SCHEME_NEON
    soft: 30
    blinder: {at: 0, len: 2, amount: 100}
    text: *mtext
    why: "Drehender Stern in Pink, Cyan und Violett, weiche Farbwechsel, warmweißer Blinder auf den Einsatz; auf der Matrix MANIAC über dem Stern, blendet nach 2 Takten aus."

  "chorus 1b":
    scene: SCENE_STAR
    scheme: SCHEME_NEON
    soft: 30
    blinder: {every: 2, at: 1, len: 0.5, color: weiss, devices: [LAMPE1, LAMPE2]}
    why: "Zweite Hälfte des Chorus: der Stern läuft weiter, dazu blitzen die Lampen weiß auf 2 und 4."

  "stehender chord":
    scene: SCENE_CALM
    scheme: SCHEME_ROYAL
    dim: 50
    blinder: {at: 0.25, len: 11.9, attack: 0.25, amount: 100}    # 11.9: len darf die Part-Länge (12 Beats) nicht erreichen
    why: "Der stehende Akkord: ein warmweißer Blinder blendet schnell ein und klingt über die ganzen 3 Takte aus, darunter atmet die Bühne dunkel in Blau und Lila."

  "strobe": *strobe

  "verse 2a":
    scene: SCENE_RAIN
    scheme: SCHEME_NEON
    fade: {to: triad, per: 8}
    why: "Anderer Look als verse 1: fallende Leuchtspuren in Pink, Cyan und Violett, die Farben wandern alle 2 Takte weiter."

  "strobe (2)": *strobe

  "verse 2b":
    scene: SCENE_CALL_RESPONSE
    scheme: SCHEME_NEON
    why: "Die Bühnenhälften blitzen abwechselnd im Beat in Pink, Cyan und Violett."

  "ist a cold cinetic heat":
    scene: SCENE_DROP
    scheme: SCHEME_RED
    why: "'heat': Schläge auf die Viertel in Rot auf allen Geräten."

  "strobe (3)": *strobe

  "chorus 2":
    scene: SCENE_STAR
    scheme: SCHEME_NEON
    soft: 30
    blinder:
      - {at: 0, len: 2, amount: 100}
      - {every: 2, at: 1, len: 0.5, color: weiss, devices: [LAMPE1, LAMPE2]}
    why: "Stern wie in chorus 1 mit Blinder auf den Einsatz, die Lampen blitzen von Anfang an weiß auf 2 und 4."

  "uebergang zum instrumental":
    scene: SCENE_WAVE_LR
    scheme: SCHEME_NEON
    why: "Der Blitz läuft pro Beat von links nach rechts über die Bühne."

  "instrumental a":
    scene: SCENE_DNA
    scheme: SCHEME_NEON
    why: "Eine DNA-Helix in Pink und Cyan dreht sich auf der Matrix, die Bühnenhälften pulsieren abwechselnd in den Strangfarben."

  "instrumental b":
    scene: SCENE_COLORS_WAVE
    scheme: SCHEME_NEON
    soft: 60
    why: "Die Farbe wandert pro Beat weich von Gerät zu Gerät über die Bühne."

  "strobe (4)": *strobe

  "solo a":
    scene: SCENE_SOLO_GIT
    scheme: SCHEME_NEON
    transition: stage_lr
    why: "Gitarrensolo: der Übergang läuft über die Bühne zur Gitarre, zwei Kometen in Pink und Cyan kreisen um die Gitarre, alle anderen atmen dunkel."

  "solo b":
    scene: SCENE_SOLO_GIT
    scheme: SCHEME_SUNSET
    why: "Das Solo weiter, die Kometen jetzt in Orange, Pink und Gelb."

  "solo c":
    fx: "progFastBlingBling(${dur}, 8, ${next})"
    why: "Das Solo dreht auf: schnelle bunte Einzelblitze (wie bisher)."

  "solo d":
    scene: SCENE_BUILDUP
    scheme: SCHEME_FIRE
    why: "Alles lädt sich über 4 Takte in Rot, Orange und Gelb auf, Explosion auf 'cut you like a knife'."

  "it could cut you like a knife (2)": *knife

  "uebergang (2)":
    scene: SCENE_BUILDUP
    scheme: SCHEME_FIRE
    why: "Lädt sich einen Takt lang in Rot, Orange und Gelb auf, Explosion genau auf den letzten Chorus."

  "chorus 3":
    scene: SCENE_STAR
    scheme: SCHEME_FIRE
    soft: 30
    blinder:
      - {at: 0, len: 2, amount: 100}
      - {every: 2, at: 1, len: 0.5, color: weiss, devices: [LAMPE1, LAMPE2]}
    text: *mtext
    why: "Eine Stufe wärmer: Stern in Rot, Orange und Gelb, Blinder auf den Einsatz, die Lampen blitzen weiß auf 2 und 4; auf der Matrix MANIAC, blendet nach 2 Takten aus."

  "stehender chord (2)":
    fx: "progFastBlingBling(${dur}, 2, ${next})"
    blinder: {bar: 156, len: 8, amount: 100}
    why: "Wenige bunte Einzelblitze (wie bisher); ein warmweißer Blinder springt auf die 1 (Takt 156) und klingt über 2 Takte aus."

  "abschluss":
    scene: SCENE_SPARKLE
    scheme: SCHEME_FIRE
    why: "Dichtes Glitzern in Rot, Orange und Gelb."

  "strobe (5)":
    fx: "progBlack(${dur}, ${next})"
    blinder: {bar: 160.75, len: 2, hold: 1, amount: 100}
    why: "Schwarz; auf der letzten Viertel (Takt 160,75) springt ein starker Blinder auf und klingt 5 Sekunden ins Schluss-Schwarz aus."
