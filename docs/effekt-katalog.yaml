# ---------------------------------------------------------------------------------------------------
# Ausgabestufe (src/fxPipeline.*): Übergänge, Modifikatoren und Ebenen-Modi. Sie wirken auf jeden Effekt.
#   yaml     so steht es in show.yaml / song.yaml
#   demo     Part in Song 92 (pipelineDemo), in dem der Baustein allein zu sehen ist
#   genutzt  Zahl der Parts in generierten Songs (Stand 04.10.2026, nur #31)
#   urteil / notiz gehören dir
# ---------------------------------------------------------------------------------------------------

ausgabestufe:

  uebergaenge:
    TRANS_FADE:       {wirkung: "Kreuzblende vom alten ins neue Bild", yaml: "transition: fade", demo: 5, genutzt: 4, urteil: , notiz: }
    TRANS_BLACK:      {wirkung: "über Schwarz: alt blendet aus, neu blendet ein", yaml: "transition: black", demo: 10, genutzt: 0, urteil: , notiz: }
    TRANS_FLASH:      {wirkung: "weißer Blitz auf der Grenze, klingt ins neue Bild ab", yaml: "transition: flash", demo: 15, genutzt: 1, urteil: , notiz: }
    TRANS_WIPE:       {wirkung: "Kante läuft über das Gerät (Lampe von unten, Gitarre vom Korpus zum Kopf, Matrix von links)", yaml: "transition: wipe", demo: 20, genutzt: 1, urteil: , notiz: }
    TRANS_WIPE_BACK:  {wirkung: "wie wipe, in Gegenrichtung", yaml: "transition: wipe_back", demo: 25, genutzt: 0, urteil: , notiz: }
    TRANS_STAGE_LR:   {wirkung: "Geräte wechseln nacheinander von links nach rechts über die Bühne", yaml: "transition: stage_lr", demo: 30, genutzt: 0, urteil: , notiz: }
    TRANS_STAGE_RL:   {wirkung: "… von rechts nach links", yaml: "transition: stage_rl", demo: 35, genutzt: 0, urteil: , notiz: }
    TRANS_STAGE_OUT:  {wirkung: "… von der Mitte (Drums) nach außen", yaml: "transition: stage_out", demo: 40, genutzt: 1, urteil: , notiz: }
    TRANS_DISSOLVE:   {wirkung: "Pixel kippen einzeln ins neue Bild", yaml: "transition: dissolve", demo: 45, genutzt: 1, urteil: , notiz: }

  modifikatoren:
    fxFadeIn_fxFadeOut: {wirkung: "Helligkeit steigt am Part-Anfang von 0 an bzw. fällt zum Part-Ende auf 0", yaml: "fade_in: <Beats> / fade_out: <Beats>", demo: 50, genutzt: 0, urteil: , notiz: }
    fxPulse:          {wirkung: "Helligkeit pumpt im Beat (oder über mehrere Beats)", yaml: "pulse: <Prozent> | {depth: , per: }", demo: "52 (Beat), 54 (Takt)", genutzt: 1, urteil: , notiz: }
    fxGate:           {wirkung: "Strobo-Tor: der laufende Effekt wird im Raster an- und ausgeschaltet", yaml: "gate: <pro Beat> | {per_beat: 2, duty: 30}", demo: 56, genutzt: 0, urteil: , notiz: }
    fxDim:            {wirkung: "gleichmäßig dunkler", yaml: "dim: <Prozent>", demo: 58, genutzt: 0, urteil: , notiz: }
    fxTint:           {wirkung: "zieht das Bild zu einer Farbe hin", yaml: "tint: <Farbe> | {color: blau, amount: 50}", demo: 60, genutzt: 0, urteil: , notiz: }
    fxMaskStage:      {wirkung: "nur bestimmte Geräte leuchten voll, der Rest gedimmt oder schwarz", yaml: "only: guitar | {devices: [guitar], others: 20}", demo: 62, genutzt: 0, urteil: , notiz: }
    fxMaskSpan:       {wirkung: "nur ein Abschnitt jedes Geräts leuchtet", yaml: "span: [von, bis]", demo: 64, genutzt: 0, urteil: , notiz: }
    fxSoft:           {wirkung: "weiche Farbwechsel im Beat: die Farbe blendet am Ende des Beats in die nächste statt zu springen (nur SCENE_COLORS / SCENE_COLORS_WAVE)", yaml: "soft: <Prozent>", demo: "7 (30 %), 8 (100 %), 9 (Welle, 60 %); zum Vergleich 6 ohne", genutzt: 0, urteil: , notiz: }
    fxSmooth:         {wirkung: "Nachleuchten für jeden Effekt: harte Wechsel werden zu Blenden, ohne den Effekt anzufassen (z. B. progFullColors, progSternNeu)", yaml: "smooth: <Beats>", demo: "4 (250 ms), 11 (1000 ms), 12 (Ping-Pong); zum Vergleich 18 ohne", genutzt: 0, urteil: , notiz: }
    fxBlinder:        {wirkung: "Blinder: helles, warmweißes Aufblenden über dem laufenden Effekt (heller als der Effekt), einmalig oder im Raster, auf allen oder einzelnen Geräten", yaml: "blinder: bar | {every: , at: , len: , amount: , color: , devices: }", demo: "17 (jede 1), 19 (einmal, lang), 22 (über dunklem Effekt), 21 (nur Lampen)", genutzt: 0, urteil: , notiz: }
    fxBlinderShape:   {wirkung: "Blinder mit eigenem Verlauf: blendet schnell ein und klingt sehr lang aus (statt aufzuspringen und halb so lang zu stehen)", yaml: "blinder: {at: , len: , attack: <Beats>, hold: <Beats>}", demo: "28", genutzt: 1, urteil: , notiz: }

  ebene:
    FX_ADD:           {wirkung: "zweiter Effekt wird aufaddiert, Schwarz ist durchsichtig (Glitzern, Blitze über einer Fläche)", yaml: "overlay: {scene: ..., mode: add}", demo: "70, 78 (nur halbes Gerät), 80 (mit Übergang + Puls)", genutzt: 2, urteil: , notiz: }
    FX_MAX:           {wirkung: "der hellere Pixel gewinnt", yaml: "overlay: {..., mode: max}", demo: 72, genutzt: 0, urteil: , notiz: }
    FX_OVER:          {wirkung: "die Ebene deckt, wo sie nicht schwarz ist (Text über einer Szene)", yaml: "overlay: {..., mode: over} | text: {..., over: true}", demo: 74, genutzt: 0, urteil: , notiz: }
    FX_MASK:          {wirkung: "die Ebene ist ein Fenster: der Effekt darunter ist nur dort zu sehen, wo sie hell ist", yaml: "overlay: {..., mode: mask}", demo: 76, genutzt: 0, urteil: , notiz: }

  ebene_steuern:      # wirken nur auf die Ebene, der Effekt darunter bleibt ruhig
    fxLayerPulse:     {wirkung: "nur die Ebene pumpt im Beat (pumpendes Glitzern über ruhiger Fläche)", yaml: "overlay: {..., pulse: <Prozent> | {depth: , per: }}", demo: 82, genutzt: 0, urteil: , notiz: }
    fxLayerFadeIn_fxLayerFadeOut: {wirkung: "die Ebene baut sich auf bzw. klingt ab, der Effekt darunter bleibt gleich hell", yaml: "overlay: {..., fade_in: <Beats>, fade_out: <Beats>}", demo: 84, genutzt: 0, urteil: , notiz: }
    fxLayerUnder:     {wirkung: "der Effekt darunter ist gedimmt, solange die Ebene da ist (Szene dunkel, Text voll hell)", yaml: "overlay: {..., under: <Prozent>} | text: {..., over: true, under: <Prozent>}", demo: 86, genutzt: 0, urteil: , notiz: }
    fxLayerWindow:    {wirkung: "die Ebene ist nur in einem Zeitfenster des Parts zu sehen (Akzent im letzten Takt ohne eigenen Part)", yaml: "overlay: {..., from: <Beats>, to: <Beats>}", demo: 88, genutzt: 0, urteil: , notiz: }
    fxLayerGate:      {wirkung: "nur die Ebene blitzt im Raster", yaml: "overlay: {..., gate: <pro Beat> | {per_beat: 2, duty: 30}}", demo: 88, genutzt: 0, urteil: , notiz: }

  text_ebene:         # eigene Ebene nur für Text, liegt über Szene und Ebene (nur Matrix)
    fxText:           {wirkung: "Szene + zweiter Effekt + Text zugleich: der Text liegt zuoberst, alles darunter läuft weiter (auf Wunsch gedimmt)", yaml: "text: {..., over: true, under: <Prozent>} zusammen mit overlay: ...", demo: 1, genutzt: 0, urteil: , notiz: }
    FX_CUT:           {wirkung: "ausgestanzter Text: die Buchstaben-LEDs sind aus, die Szene leuchtet drumherum (nur über hellen, gleichmäßigen Flächen lesbar)", yaml: "text: {..., over: true, color: schwarz}", demo: "90, zum Vergleich 2 (Szene nur in den Buchstaben, overlay mode: mask)", genutzt: 0, urteil: , notiz: }
    fxTextGradient:   {wirkung: "Farbverlauf in der Schrift statt einer Farbe (progText, progTextScroll): Palette oder Schemafarben, quer / hoch / schräg / am Text befestigt, auf Wunsch wandernd", yaml: "text: {..., gradient: scheme|rainbow|party|... | {palette: , dir: h|v|diag|letters, per: }}", demo: "29, 31, 32, 33", genutzt: 0, urteil: gern, notiz: "06.10.2026: Part 29 (Schemafarben quer), 32 (Party-Palette am Text befestigt) und 33 (Schemafarben schräg, wandernd) super -> Titel-Lauftext aller Songs (progScrollText), je Part per Zufall; 31 (Regenbogen von oben nach unten, wandernd) ok, aber nicht sein Favourite - auf seinen Wunsch trotzdem als vierte Variante im Titel-Lauftext" }

# ---------------------------------------------------------------------------------------------------
# Muster aus den alten Songs (docs/effekt-statistik.md) - dein Geschmack in Zahlen
# ---------------------------------------------------------------------------------------------------

muster:
  - "Chorus = progSternNeu (45 von 99), sonst progFastBlingBling (26) oder progFullColors (17). Nie progPalette oder progRandomLines."
  - "Verse = progPalette (17), progRandomLines (11), progFullColors (10), progBlingBlingColoring (6). Nie progSternNeu."
  - "Vor dem Chorus steht in der Hälfte der Fälle progStrobo, meist 1 Takt (38 von 75 Übergängen in einen Chorus)."
  - "Intro/Outro ruhig funkelnd: progBlingBlingColoring, progPalette; Outro oft progFastBlingBling."
  - "Solo = progWaterRipple (5 von 15): das Solo wurde ruhig und fließend gezeigt, nicht als Höhepunkt."
  - "Bridge = progPalette (7 von 15): Farbwechsel statt Formwechsel."
  - "Farbwechsel im Beat: 1 Beat ist Standard (Stern, RandomLines, FullColors), 2 Beats die ruhigere Variante."
  - "Parts sind im Median 8 Takte lang; kein Flächen-Effekt läuft länger als 16 Takte am Stück."

luecken:
  - "Geschlossen am 04.10.2026 durch SCENE_STAR, SPARKLE, GLOW, COLORS, COLORS_WAVE, RAIN, PALETTE: Glitzern, Stern, ruhige Flächen, Farbband über die Bühne."
  - "Offen: progRandomLines/progCircles im Beat, progMatrixScanner und progWaterRipple haben noch keine eigene Szene (WaterRipple nur als Matrix-Teil von CALM/DROP)."
  - "Geschlossen am 05.10.2026: progPalette hat Tempo und Fade-Wahl als optionale Parameter. Offen: Palette 12 ist nicht definiert. Die schönen festen Paletten (3, 6, 7, 8, 9/10, 11) gibt es nicht als Szene, SCENE_PALETTE nutzt nur die Schemafarben."
  - "Teilweise geschlossen am 05.10.2026: Fading-Option für SCENE_COLORS / SCENE_COLORS_WAVE (soft: <Prozent>, fxSoft). Für progFullColors / progSternNeu und alle anderen Effekte seit 05.10.2026 über smooth: <Beats> (fxSmooth)."
  - "Geschlossen am 04.10.2026: weiches Ausblenden am Songende (SCENE_FADEOUT / progFadeOut)."
  - "Offen: progSternschnuppen als ruhiges Pausen-Preset für Gitarren und Lampen überarbeiten."
  - "Geschlossen am 04.10.2026: Effekte lassen sich übereinanderlegen (overlay in show.yaml/song.yaml, fxLayerBegin/End), z. B. Glitzern über einer ruhigen Fläche. Eine Ebene pro Part, oben und unten verschiedene Effekte."
