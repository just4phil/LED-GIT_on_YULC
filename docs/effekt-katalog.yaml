    urteil: gern
    notiz: "06.10.2026 (ATTSS-Hook, Demo 92 Parts 34/36): Wörter mit eigener Länge 'sehr geil'; hart und abklingend (flash) 'beides ist super' - über einem Effekt (over) nahm er hart, weil sich der Text so besser vom Effekt darunter abhebt"

  progTextScroll:
    wirkung: "Lauftext, der genau am Part-Ende fertig ist; gleitet weich von Pixel zu Pixel (TEXT_SCROLL_BLEND 2, vom User am 06.10.2026 abgenommen: 'das gefällt mir gut')"
    art: text
    rolle: [flaeche]
    energie: [1, 3]
    bewegung: wandernd
    beat: frei
    farbe: schema
    traegt_takte: "4-12"
    alt: {parts: 0, takte: 0, wofuer: "alt als progScrollText: Songtitel während der Anfangspause (15x)"}
    urteil:
    notiz:


