# Effekt-Katalog: Steckbriefe aller Effekte, Paletten und Szenen
#
# Zweck: Effekte nach WIRKUNG auswählen statt nach Gewohnheit. Für einen Part sucht man über
# energie + rolle + bewegung die Kandidaten und nimmt nicht immer denselben Griff.
#
# Stand der Einträge: von Claude aus dem Code (src/FXprograms.*, guitarShapeFX.*, scenes.*) und aus der
# Auswertung der alten Songs (docs/effekt-statistik.md, tools/fxstats.py) VORGEFÜLLT. energie, rolle und
# traegt_takte sind Schätzungen - nur du hast die Effekte live gesehen. Bitte korrigieren und vor allem
# `urteil` und `notiz` ausfüllen; die beiden Felder gehören dir und werden von Claude nicht überschrieben.
#
# Felder
#   wirkung       ein Satz: was man sieht
#   art           raster  = rechnet im Matrix-Raster. Auf Gitarre/Bass entsteht daraus ein eigenes Muster entlang
#                           der Kontur - oft ein Glücksfall (Stern, MatrixHorizontal sehen dort sehr geil aus)
#                 strip   = schreibt direkt in die LED-Kette, läuft auf jedem Gerät gleich gut
#                 kontur  = nutzt die Form der Gitarre (Zonen, Abstand zum Kopf, XY)
#                 lampe   = für die vertikalen Lampen gebaut
#                 text    = nur Matrix-Geräte
#   rolle         flaeche   trägt einen ganzen Part
#                 akzent    kurz, 1-4 Beats bis 1-2 Takte
#                 aufbau    steigert sich auf ein Ziel hin
#                 uebergang verbindet zwei Parts
#                 stille    Schwarz oder fast nichts
#   energie       [von, bis] auf der Skala 0-5 aus song.yaml
#   bewegung      statisch | pulsierend | fliessend | wandernd | funkelnd | rotierend | flackernd
#   beat          fest = läuft taktgenau über bpm | param = ein Zeitwert lässt sich auf Beat/Takt setzen | frei
#   farbe         schema = folgt dem Farbschema | zufall = Zufallsfarben (mit Schema: aus dem Schema) |
#                 eigen = feste eigene Farben | param = Farbe als Parameter
#   traegt_takte  wie lange der Effekt trägt, bevor er eintönig wird (Schätzung aus den alten Songs)
#   alt           Nutzung in den 21 alten Songs: Parts / Takte / wofür / typische Parameter
#   regler        die Parameter, die den Charakter ändern
#   urteil        DEIN Feld: gern | ok | selten | unzufrieden | nicht mehr   (Stand: deine Erläuterung vom 04.10.2026)
#   notiz         DEIN Feld: was dir live auffällt

effekte:

  # ---------- Arbeitspferde der alten Songs (93 % der Spielzeit) ----------

  progSternNeu:
    wirkung: "Stern mit 4-8 Strahlen dreht sich, Farbe wechselt im Beat; mit wander zieht die Mitte ihre Bahn"
    art: raster
    rolle: [flaeche]
    energie: [4, 5]
    bewegung: rotierend
    beat: param          # msForColorChange
    farbe: zufall
    traegt_takte: "8-16"
    alt: {parts: 57, takte: 406, wofuer: "DER Chorus-Effekt (45 von 99 Chorus-Parts)",
          parameter: "Farbwechsel 1 Beat (31x) oder 2 Beats (19x); reduceSpeed 5; wander true/false etwa gleich oft; 3 oder 4 Arm-Paare"}
    regler: "msForColorChange (1 Beat = treibend, 2 Beats/1 Takt = ruhiger), wander, numArms"
    urteil: gern
    notiz: "für die Matrix entwickelt, sieht aber auch auf den Gitarren sehr geil aus - gern für Refrains"

  progStern:
    wirkung: "Vorgänger von progSternNeu ohne Wandern und ohne wählbare Arme"
    art: raster
    rolle: [flaeche]
    energie: [4, 5]
    bewegung: rotierend
    beat: param
    farbe: zufall
    traegt_takte: "8-16"
    alt: {parts: 0, takte: 0, wofuer: "in den übernommenen Songs durch progSternNeu ersetzt"}
    urteil: gern
    notiz: "wie progSternNeu: Matrix-Effekt, der auf den Gitarren sehr geil aussieht - Refrains"

  progFastBlingBling:
    wirkung: "Ganz schnelle zufällige Einzelblitze - da geht die Post ab; Dichte über anzahl"
    art: strip
    rolle: [flaeche]
    energie: [4, 5]
    bewegung: funkelnd
    beat: frei
    farbe: zufall
    traegt_takte: "1-8, selten 16"
    alt: {parts: 82, takte: 375, wofuer: "Chorus (26), Instrumental (13), Outro (6), Übergänge (7); der vielseitigste Effekt",
          parameter: "anzahl 8 (23x), 4 (20x), 6 (14x), 2 (8x); selten mit addLEDs = wächst über den Part an"}
    regler: "anzahl: 2 = dezent, 4-6 = mittel, 8+ = intensiv; addLEDs/maxLEDs/delay = Steigerung im Part"
    urteil: gern
    notiz: "Highlight! Für Refrains mit richtig Action und für den Höhepunkt am Songende"

  progPalette:
    wirkung: "Farbband läuft über alle LEDs; Aussehen hängt ganz von der Palette ab - siehe Abschnitt paletten"
    art: strip
    rolle: [flaeche]
    energie: [1, 4]
    bewegung: fliessend
    beat: frei
    farbe: eigen         # nur Palette 4 und 20 folgen dem Schema
    traegt_takte: "8-12"
    alt: {parts: 54, takte: 355, wofuer: "Verse (17), Bridge (7), Intro (7); fast nie im Chorus (1)",
          parameter: "12 verschiedene Paletten, am häufigsten 4, 6, 3, 9, 2"}
    regler: "paletteID; seit 05.10.2026 optional Tempo und Fade: progPalette(dur, id, next, <ms je Durchlauf>, PAL_BLEND_AUTO|ON|OFF). Mit Tempo auf allen Geräten gleich schnell, Demo: Song 92, Parts 13 (alt), 14, 16"
    urteil: gern
    notiz: "sehr schöne Farbverläufe; die Paletten einzeln anschauen (Farben, Tempo, mit/ohne Fades)"

  progRandomLines:
    wirkung: "Zufällige Linien in Zufallsfarbe; clearEach=true: je Schritt eine neue Linie, false: Linien stapeln sich"
    art: raster
    rolle: [flaeche]
    energie: [2, 4]
    bewegung: pulsierend
    beat: param          # msForChange
    farbe: zufall
    traegt_takte: "4-12"
