          parameter: "del 50 ms (33x) = Flimmern; 1 Beat / 1/2 Beat (15x) = Schläge im Takt; Zufallsfarbe (68x) oder weiß (22x)"}
    regler: "del: 50-65 = Flimmern, 100-120 = hart, 1/2 oder 1 Beat = Akzente auf die Zählzeit; weiß = härter als farbig"
    urteil: gern
    notiz: "für Übergänge, auch mal im Refrain oder wenn triolisch gespielt wird; alle Geräte"

  progFullColors:
