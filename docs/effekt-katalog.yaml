          parameter: "Wechsel fast immer 1 Beat (29x); clearEach true (25x) / false (12x)"}
    regler: "msForChange (Beat-Raster), clearEach: true = klar und rhythmisch, false = füllt sich, aufbauend"
    urteil: ok
    notiz: "gut, wenn es korrekt zum Takt läuft; mit sehr schnellem Wechsel auch für schnelle Refrains"

