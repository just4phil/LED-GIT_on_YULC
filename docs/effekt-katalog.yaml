    traegt_takte: "2-4, einmal pro Song"
    alt: {parts: 0, takte: 0}
    urteil: gern
    notiz: "pauschal: die neuen, mit KI entwickelten Effekte sind sehr geil (nicht einzeln bewertet)"

  # ---------- Primitive für alle Geräte / Lampen ----------

  progBreathe:
    wirkung: "Ganzes Gerät atmet langsam in einer Farbe"
    art: strip
    rolle: [flaeche]
    energie: [1, 1]
    bewegung: pulsierend
    beat: param          # periodMillis = 1 Takt
    farbe: param
    traegt_takte: "4-8"
    alt: {parts: 0, takte: 0, wofuer: "SCENE_CALM und die Nicht-Solisten in SCENE_SOLO_*"}
    urteil:
    notiz:

  progBeatFlash:
    wirkung: "Blitz auf jedem Beat, klingt ab; mit Verzögerung pro Gerät wird daraus eine Welle über die Bühne"
    art: strip
    rolle: [flaeche, akzent]
    energie: [3, 5]
    bewegung: pulsierend
    beat: fest
    farbe: param
    traegt_takte: "2-8"
    alt: {parts: 0, takte: 0, wofuer: "SCENE_WAVE_*, Lampen in SCENE_DROP"}
    urteil:
    notiz:

  progPingPong:
    wirkung: "Pro Beat leuchtet genau ein Gerät der Bühne, der Rest ist dunkel"
    art: strip
    rolle: [flaeche]
    energie: [3, 4]
    bewegung: wandernd
    beat: fest
    farbe: schema
    traegt_takte: "4-8"
    alt: {parts: 0, takte: 0, wofuer: "SCENE_PINGPONG"}
    urteil:
    notiz:

  progLampFill:
    wirkung: "Lampe füllt sich über die Partdauer von unten, am Ende weiße Explosion"
    art: lampe
    rolle: [aufbau]
    energie: [3, 5]
    bewegung: wandernd
    beat: fest
    farbe: param
    traegt_takte: "1-8"
    alt: {parts: 0, takte: 0, wofuer: "Lampen-Teil von SCENE_BUILDUP"}
    urteil:
    notiz:

  progLampPulse:
    wirkung: "Leichter Blitz pro Beat, dazu ein Lichtschuss nach oben"
    art: lampe
    rolle: [flaeche]
    energie: [2, 3]
    bewegung: pulsierend
    beat: fest
    farbe: param
    traegt_takte: "8-16"
    alt: {parts: 0, takte: 0, wofuer: "Lampen-Teil von SCENE_VERSE"}
    urteil:
    notiz:

  progLampFire:
    wirkung: "Feuer brennt die Lampe hinauf"
    art: lampe
    rolle: [flaeche]
    energie: [4, 5]
    bewegung: flackernd
    beat: frei
    farbe: eigen
    traegt_takte: "8-16"
    alt: {parts: 0, takte: 0, wofuer: "Lampen-Teil von SCENE_FIRE"}
    urteil:
    notiz:

  # ---------- Text (nur Matrix-Geräte; in show.yaml über `text:` statt von Hand) ----------

  progText:
    wirkung: "Wort pulsiert im Beat bzw. pro Beat das nächste Wort, automatisch zentriert; ein Wort mit *Zahl am Ende bleibt so viele Beats stehen (THIS IS NOT ENOUGH*5; Demo 92 Part 34); mit flash klingen die Wörter ab wie der Lampen-Blitz statt hart an/aus (Demo 92 Part 36)"
