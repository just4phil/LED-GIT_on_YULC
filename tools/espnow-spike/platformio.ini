; ESP-NOW-Messprogramm für Issue #8 (Phase 0 aus docs/ESP-NOW-Plan.html)
;
; Ein eigenes, kleines PlatformIO-Projekt - NICHT Teil der Show-Firmware. Es liegt nur im Branch espnow-spike
; und wird nach der Messung nicht nach MAIN übernommen.
;
; Bauen und flashen (im Ordner tools/espnow-spike):
;   pio run -t upload --upload-port COM11
;   pio device monitor --port COM11
; Beide Boards bekommen dasselbe Programm; was ein Board tut, wählt man im Serial Monitor (Befehl h = Hilfe).

[env:spike]
platform = espressif32				; dieselbe Plattform wie die Show-Firmware (Arduino-Core 2.0.17)
board = esp32-s3-devkitc-1
framework = arduino
build_flags =
	-D ARDUINO_USB_MODE=1			; wie in der Firmware: nötig, damit der Serial Monitor über USB geht
	-D ARDUINO_USB_CDC_ON_BOOT=1
board_build.arduino.memory_type = qio_qspi
board_build.flash_mode = qio
board_build.psram_type = qio
board_upload.flash_size = 16MB
upload_speed = 115200
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
lib_deps =
	fastled/FastLED@3.5.0			; genau die Version der Firmware - der Flacker-Test soll dieselbe Ausgabe prüfen
